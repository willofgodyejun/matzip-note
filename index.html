<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>골목 맛집 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 간판 헤더 → 맛집 기준 한 줄 → 지도(네이버/카카오 전환, 반경 선택) → 필터 → 카드 그리드 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1C2320; --muted:#5E6A64; --line:#D9E0DB;
  --chili:#C8281E; --chili-soft:#FBE3E0; --mustard:#E0A526; --mustard-soft:#FBF0D6;
  --naver:#03A94D; --kakao:#C99A00; --good:#1F7A4D; --good-soft:#DDF1E6;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --surface:#1D2421; --ink:#ECF1EE; --muted:#9AA8A1; --line:#2F3934;
  --chili:#F0564A; --chili-soft:#3A1F1C; --mustard:#E8B649; --mustard-soft:#3A3120;
  --naver:#3DD27F; --kakao:#F2C230; --good:#5CCB94; --good-soft:#1C3328; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:28px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:20px}
.sign{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,72px);line-height:1;margin:0;text-wrap:balance}
.sign em{font-style:normal;color:var(--chili)}
.tag{margin:8px 0 0;color:var(--muted);max-width:52ch}
.note{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:6px 10px;border-radius:4px}

.criteria{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;align-items:center}
.criteria span{border:1px solid var(--line);border-radius:4px;padding:2px 9px;color:var(--muted);background:var(--surface)}
.criteria span b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.criteria .head{border:0;background:none;padding-left:0;color:var(--ink);font-weight:700}

/* 지도 */
.mapbox{display:flex;flex-direction:column;gap:10px}
.maptop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:15px;border:0;background:var(--surface);color:var(--ink);padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.radius{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.locbar{display:flex;flex-wrap:wrap;gap:8px}
.locbar input{flex:1 1 240px;min-width:0}
#map{width:100%;height:420px;border-radius:6px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.mapmsg{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.mapmsg code{font-family:var(--mono);font-size:13px;background:var(--bg);padding:2px 6px;border-radius:4px}
.status{font-size:15px}
.status b{color:var(--chili);font-weight:400}
.hint{color:var(--muted);font-size:14px}

/* 필터 */
.filters{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);width:72px;flex:none}
.chip,.btn{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip:hover,.btn:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border-radius:6px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search],select{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:7px 12px}
.tools input[type=search]{flex:1 1 220px;min-width:0}
.check{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.on{border-color:var(--chili);box-shadow:0 0 0 1px var(--chili)}
.card.near{border-style:dashed}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
.area{font-size:14px;color:var(--muted)}
.dist{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.ratings{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rt{display:flex;flex-direction:column;gap:0;background:var(--bg);border-radius:4px;padding:6px 10px;box-shadow:inset 3px 0 0 var(--c)}
.rt.n{--c:var(--naver)} .rt.k{--c:var(--kakao)}
.rt .l{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rt span{font-size:13px;color:var(--muted)}
.rt b{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.rt b.none{font-family:var(--body);font-size:13px;color:var(--muted)}
.rt small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rt small.down{color:var(--chili)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:8px;font-size:14px}
.prices span{color:var(--muted)}
.prices .won{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);float:right}
.hours{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.quote{margin:0}
.quote.pending{color:var(--muted);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:13px;padding:2px 9px;border-radius:4px;background:var(--bg);color:var(--muted)}
.b.hot{background:var(--chili-soft);color:var(--chili)}
.b.down{background:var(--chili-soft);color:var(--chili)}
.b.wait{color:var(--ink);box-shadow:inset 3px 0 0 var(--mustard)}
.b.fr{background:var(--mustard-soft);color:var(--ink)}
.b.visit{background:var(--good-soft);color:var(--good)}
.b.stale{background:var(--mustard-soft);color:var(--ink)}
.fails{margin:0;padding:8px 10px;border-radius:4px;background:var(--chili-soft);color:var(--chili);font-size:13px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:auto}
.links button,.links a{font:inherit;background:none;border:0;padding:0;color:var(--chili);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:32px 16px;border:1.5px dashed var(--line);border-radius:6px}
.empty b{color:var(--ink);font-weight:400}
@media (max-width:640px){#map{height:320px}.row .lbl{width:100%}}
</style>

<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="sign">골목 <em>맛집</em> 수첩</h1>

  <section class="mapbox" aria-label="위치 설정">

      <input type="search" id="addr" placeholder="주소나 장소 검색 (예: 홍대입구역, 성수동)" aria-label="위치 검색">
      <button class="btn primary" type="submit">이 위치로</button>
      <button class="btn" type="button" id="myLoc">내 위치</button>
      <button class="btn" type="button" id="clearLoc">위치 해제</button>
    </form>
    <div id="map"><div class="mapmsg">지도를 불러오는 중…</div></div>
    <div class="status" id="status"></div>
  </section>

  <section class="filters" aria-label="필터">

    <div class="row" id="priceRow"><span class="lbl">점심 1인</span></div>
    <div class="tools">
      <input type="search" id="q" placeholder="가게 이름, 메뉴, 동네로 찾기" aria-label="검색">
      <select id="sort" aria-label="정렬">
        <option value="dist">가까운 순</option>
        <option value="lunch">점심 가성비 순</option>
        <option value="naver">네이버 평점 순</option>
        <option value="kakao">카카오 평점 순</option>
        <option value="name">이름순</option>
      </select>
      <label class="check"><input type="checkbox" id="showFr"> 프랜차이즈 포함</label>
    </div>
    <div class="count" id="count"></div>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>
</div>

  {name:"한우 다이닝 소반", area:"선릉역", zone:"핵심", cat:"한식", menu:"한우 코스", lunch:48000, dinner:120000, hours:"11:30–22:00", brk:"15:00–17:30", quote:"", tags:["부모님과","룸 있음","예약 필수"], wait:false, party:["2인","3~4인"], lat:37.5045, lng:127.0490, franchise:false, visited:false, checked:"2026-10-20", naver:{score:4.66,recent:4.6,count:418}, kakao:{score:4.4,recent:4.4,count:29}}

const PARTIES = ["전체","1인","2인","3~4인","5인 이상"];
const PRICES = [
  {id:"all", label:"전체", test:()=>true},
  {id:"p1", label:"1만원 이하", test:w=>w<=10000},
  {id:"p2", label:"1~2만원", test:w=>w>10000&&w<=20000},
  {id:"p3", label:"2~3만원", test:w=>w>20000&&w<=30000},
  {id:"p4", label:"3~4만원", test:w=>w>30000&&w<=40000},
  {id:"p5", label:"4~5만원", test:w=>w>40000&&w<=50000}

const PV_NAME = {naver:"네이버 지도", kakao:"카카오맵"};
const state = {cat:"전체", party:"전체", price:"all", q:"", sort:"dist", showFr:false, radius:1000,
  center:null, centerName:"", selected:null, provider:"naver"};

  const p=localStorage.getItem("matjip-provider"); if(p==="naver"||p==="kakao") state.provider=p;
  const r=+localStorage.getItem("matjip-radius"); if(RADII.includes(r)) state.radius=r;

const $ = id=>document.getElementById(id);
const fmt = n=>n.toLocaleString("ko-KR")+"원";
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const setStatus = html=>{$("status").innerHTML=html;};
const km = m=>`${m/1000}km`;

function distM(a,b){
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = m=>m<1000?`${Math.round(m/10)*10}m`:`${(m/1000).toFixed(1)}km`;

/* ===== 기준 판정 ===== */
const reviewTotal = d=>(d.naver?.count||0)+(d.kakao?.count||0);
const reviewNeed = d=>CRITERIA.reviewMin[d.zone] ?? CRITERIA.reviewMin["핵심"];
function failures(d){
  const f=[];
  if(d.naver?.score==null) f.push("네이버 평점 없음");
  else if(d.naver.score<CRITERIA.naverMin) f.push(`네이버 ${d.naver.score.toFixed(2)} (기준 ${CRITERIA.naverMin})`);
  if(d.kakao?.score==null) f.push("카카오 평점 없음");
  else if(d.kakao.score<CRITERIA.kakaoMin) f.push(`카카오 ${d.kakao.score.toFixed(1)} (기준 ${CRITERIA.kakaoMin})`);
  if(reviewTotal(d)<reviewNeed(d)) f.push(`방문자 리뷰 ${reviewTotal(d).toLocaleString("ko-KR")}개 (${d.zone} 상권 기준 ${reviewNeed(d)}개)`);
  return f;
}
const isMatjip = d=>failures(d).length===0;
const recentDrop = d=>(d.naver?.recent!=null&&d.naver.recent<CRITERIA.naverMin)||(d.kakao?.recent!=null&&d.kakao.recent<CRITERIA.kakaoMin);
const isStale = d=>(TODAY-new Date(d.checked))/864e5>CRITERIA.refreshDays;

/* ===== 필터 UI ===== */
function chips(rowId, items, key, getId, getLabel){
  items.forEach(it=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.dataset.v=getId(it);
    b.textContent=getLabel(it);
    b.addEventListener("click",()=>{state[key]=getId(it);render();});
    $(rowId).appendChild(b);
  });
}
const CATS = ["전체", ...new Set(DATA.map(d=>d.cat))];
chips("catRow", CATS, "cat", c=>c, c=>c);
chips("partyRow", PARTIES, "party", p=>p, p=>p);
chips("priceRow", PRICES, "price", p=>p.id, p=>p.label);
RADII.forEach(r=>{
  const b=document.createElement("button"); b.type="button"; b.dataset.r=r; b.textContent=km(r);
  b.addEventListener("click",()=>{ state.radius=r; try{localStorage.setItem("matjip-radius",r);}catch(e){}
    if(state.center) map?.setCenter(state.center.lat,state.center.lng,state.radius); render(); });
  $("radiusSeg").appendChild(b);
});
$("q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});
$("showFr").addEventListener("change",e=>{state.showFr=e.target.checked;render();});

/* 기준을 제외한 조건(위치·필터)만 적용 */
function baseFiltered(){
  const pt=PRICES.find(p=>p.id===state.price).test;
  const q=state.q.toLowerCase();
  return DATA.map(d=>({...d, dist: state.center?distM(state.center,d):null}))
    .filter(d=>(state.cat==="전체"||d.cat===state.cat)
      &&(state.party==="전체"||d.party.includes(state.party))
      &&pt(d.lunch)
      &&(state.showFr||!d.franchise)
      &&(!state.center||d.dist<=state.radius)
      &&(!q||[d.name,d.menu,d.area,...d.tags].join(" ").toLowerCase().includes(q)));
}
function sortList(list){
  const s=state.sort==="dist"&&!state.center?"naver":state.sort;
  const sc=(d,pv)=>d[pv]?.score ?? -1;
  const cmp={dist:(a,b)=>a.dist-b.dist,
    lunch:(a,b)=>a.lunch-b.lunch || sc(b,"naver")-sc(a,"naver"),
    naver:(a,b)=>sc(b,"naver")-sc(a,"naver"), kakao:(a,b)=>sc(b,"kakao")-sc(a,"kakao"),
    name:(a,b)=>a.name.localeCompare(b.name,"ko")}[s];
  return list.sort(cmp);
}

function ratingBox(cls,label,r){
  if(!r||r.score==null) return `<div class="rt ${cls}"><div class="l"><span>${label}</span><b class="none">평점 없음</b></div></div>`;
  const min = cls==="n"?CRITERIA.naverMin:CRITERIA.kakaoMin;
  const rec = r.recent!=null?`<small class="${r.recent<min?"down":""}">최근 ${CRITERIA.recentMonths}개월 ${r.recent.toFixed(cls==="n"?2:1)}</small>`:"";
  return `<div class="rt ${cls}"><div class="l"><span>${label}</span><b>★ ${r.score.toFixed(cls==="n"?2:1)}</b></div>${rec}<small>방문자 리뷰 ${r.count.toLocaleString("ko-KR")}</small></div>`;
}

function card(d, near){
  const nUrl="https://map.naver.com/p/search/"+encodeURIComponent(d.name);
  const kUrl="https://map.kakao.com/link/search/"+encodeURIComponent(d.name);
  const badges=[
    d.visited?'<span class="b visit">직접 확인</span>':'',
    recentDrop(d)?'<span class="b down">최근 하락</span>':'',
    d.franchise?'<span class="b fr">프랜차이즈</span>':'',
    d.wait?'<span class="b wait">웨이팅 있음</span>':'',
    ...d.tags.map(t=>`<span class="b${t==='매운맛'?' hot':''}">${esc(t)}</span>`),
    isStale(d)?'<span class="b stale">갱신 필요</span>':''
  ].join("");
  const quote = d.visited&&d.quote
    ? `<p class="quote">${esc(d.quote)}</p>`
    : `<p class="quote pending">한 줄 평은 직접 가 본 뒤에 적어요.</p>`;
  return `<article class="card${near?" near":""}${state.selected===d.name?" on":""}" data-name="${esc(d.name)}">
    <div class="top"><div><h3>${esc(d.name)}</h3><div class="area">${esc(d.area)} · ${esc(d.zone)} 상권 · ${esc(d.cat)} · ${d.party.join("·")}</div></div>
    ${d.dist!=null?`<span class="dist">${fmtDist(d.dist)}</span>`:""}</div>
    ${near?`<p class="fails">기준 미달: ${failures(d).map(esc).join(" · ")}</p>`:""}
    <div class="ratings">${ratingBox("n","네이버",d.naver)}${ratingBox("k","카카오",d.kakao)}</div>
    <div class="prices"><div><span>점심</span><span class="won">${fmt(d.lunch)}</span></div><div><span>저녁</span><span class="won">${fmt(d.dinner)}</span></div>
      <div style="grid-column:1/-1"><span>대표</span> ${esc(d.menu)}</div></div>
    <div class="hours"><span>영업 ${esc(d.hours)}</span><span>브레이크 ${esc(d.brk)}</span></div>
    ${quote}
    <div class="badges">${badges}</div>
    <div class="meta">평점 확인 ${esc(d.checked)}</div>
    <div class="links"><button type="button" data-focus="${esc(d.name)}">지도에서 보기</button><a href="${nUrl}" target="_blank" rel="noopener">네이버 지도</a><a href="${kUrl}" target="_blank" rel="noopener">카카오맵</a></div>
  </article>`;
}

function render(){
  for(const [row,key] of [["catRow","cat"],["partyRow","party"],["priceRow","price"]])
    document.querySelectorAll(`#${row} .chip`).forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===state[key]));
  document.querySelectorAll(".seg [data-pv]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.pv===state.provider));
  document.querySelectorAll("#radiusSeg button").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.r===state.radius));
  $("showFr").checked=state.showFr;

  const base=baseFiltered();
  const list=sortList(base.filter(isMatjip));
  const scope = state.center ? `반경 ${km(state.radius)} 안` : "전체";
  $("count").textContent = `${scope} 맛집 ${list.length}곳 (등록 ${DATA.length}곳 중 기준 통과 ${DATA.filter(isMatjip).length}곳)`
    + (state.center?"":" · 위치를 정하면 반경으로 좁혀져요");

  let html = list.map(d=>card(d,false)).join("");
  let shown = list;
  if(!list.length){
    const near = base.filter(d=>!isMatjip(d)).sort((a,b)=>failures(a).length-failures(b).length || (b.naver?.score??0)-(a.naver?.score??0)).slice(0,3);
    html = `<div class="empty"><b>${scope}에는 기준을 모두 넘은 곳이 없어요.</b><br>${near.length?"기준에 조금 못 미치는 근접 후보를 보여 드릴게요. 반경을 넓히거나 필터를 바꿔 볼 수도 있어요.":"반경을 넓히거나 필터를 '전체'로 바꿔 보세요."}</div>`
      + near.map(d=>card(d,true)).join("");
    shown = near;
  }
  $("grid").innerHTML = html;
  renderStatus();
  if(map) map.setPlaces(shown, state.selected, n=>focusPlace(n,true));
}
function renderStatus(){
  setStatus(state.center
    ? `📍 <b>${esc(state.centerName||"선택한 위치")}</b> 기준 반경 ${km(state.radius)}`
    : '<span class="hint">지도를 클릭하거나 주소를 검색해 기준 위치를 정하세요.</span>');
}
$("grid").addEventListener("click",e=>{
  const n=e.target.closest("[data-focus]")?.dataset.focus;
  if(n) focusPlace(n);
});

$("criteria").innerHTML =
  `<span class="head">맛집 기준</span><span>네이버 ★ <b>${CRITERIA.naverMin.toFixed(1)}</b> 이상</span>`
  + `<span>카카오 ★ <b>${CRITERIA.kakaoMin.toFixed(1)}</b> 이상</span>`
  + `<span>방문자 리뷰 핵심 상권 <b>${CRITERIA.reviewMin["핵심"]}</b>개 · 주거지 <b>${CRITERIA.reviewMin["주거지"]}</b>개 이상</span>`
  + `<span>최근 ${CRITERIA.recentMonths}개월 평점이 떨어지면 '최근 하락' 표시</span>`;

/* ===== 지도 공통 ===== */
const COLOR = {ink:"#1C2320", chili:"#C8281E"};
function pinEl(d, on, pv, onClick){
  const el=document.createElement("div");
  const s=d[pv]?.score;
  el.textContent=`${d.name} ${s!=null?"★"+s.toFixed(1):""}`;
  el.style.cssText=`white-space:nowrap;font:13px 'Gowun Dodum',sans-serif;cursor:pointer;background:${on?COLOR.chili:"#fff"};color:${on?"#fff":COLOR.ink};border:1.5px ${isMatjip(d)?"solid":"dashed"} ${COLOR.ink};border-radius:999px;padding:2px 10px;box-shadow:0 1px 3px rgba(0,0,0,.3)`;
  el.addEventListener("click",ev=>{ev.stopPropagation();onClick(d.name);});
  return el;
}
function centerDot(){
  const el=document.createElement("div");
  el.style.cssText="width:18px;height:18px;border-radius:50%;background:#1C2320;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)";
  return el;
}
function loadScript(src){
  return new Promise((ok,fail)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=fail;document.head.appendChild(s);});
}
const keyMissing = k=>!k || /^YOUR_/.test(k);

/* ===== 네이버 어댑터 ===== */
const NaverMap = {
  async init(el,onClick){
    if(keyMissing(NAVER_KEY_ID)) throw {msg:"네이버 지도 Client ID가 아직 없어요.<br>파일 위쪽 <code>NAVER_KEY_ID</code>에 넣어 주세요."};
    window.navermap_authFailure=()=>{el.innerHTML='<div class="mapmsg">네이버 지도 인증에 실패했어요. 콘솔에 이 페이지 주소가 Web 서비스 URL로 등록돼 있는지 확인해 주세요.</div>';};
    if(!window.naver?.maps) await loadScript(`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(NAVER_KEY_ID)}&submodules=geocoder`);
    el.innerHTML="";
    const N=naver.maps;
    this.m=new N.Map(el,{center:new N.LatLng(37.54,126.99),zoom:12,zoomControl:true,zoomControlOptions:{position:N.Position.TOP_RIGHT}});
    N.Event.addListener(this.m,"click",e=>onClick(e.coord.lat(),e.coord.lng()));
    this.pins={};
  },
  setCenter(lat,lng,radius){
    const N=naver.maps, p=new N.LatLng(lat,lng);
    if(!this.dot){
      this.dot=new N.Marker({position:p,zIndex:200,icon:{content:centerDot(),anchor:new N.Point(9,9)}});
      this.circle=new N.Circle({center:p,radius,strokeColor:COLOR.chili,strokeWeight:2,strokeOpacity:.8,fillColor:COLOR.chili,fillOpacity:.08,clickable:false});
    }
    this.dot.setPosition(p); this.circle.setCenter(p); this.circle.setRadius(radius);
    this.dot.setMap(this.m); this.circle.setMap(this.m);
    this.m.fitBounds(this.circle.getBounds());
  },
  clearCenter(){ this.dot?.setMap(null); this.circle?.setMap(null); },
  setPlaces(list,selected,onPick){
    const N=naver.maps;
    Object.values(this.pins).forEach(m=>m.setMap(null)); this.pins={};
    list.forEach(d=>{
      const on=selected===d.name;
      this.pins[d.name]=new N.Marker({map:this.m,position:new N.LatLng(d.lat,d.lng),zIndex:on?150:100,
        icon:{content:pinEl(d,on,"naver",onPick),anchor:new N.Point(0,30)}});
    });
  },
  panTo(lat,lng){ this.m.panTo(new naver.maps.LatLng(lat,lng)); },
  search(q,cb){
    if(!naver.maps.Service) return cb(null);
    naver.maps.Service.geocode({query:q},(st,res)=>{
      const a=res?.v2?.addresses?.[0];
      cb(st===naver.maps.Service.Status.OK&&a?{lat:+a.y,lng:+a.x,name:a.roadAddress||a.jibunAddress||q}:null);
    });
  },
  reverse(lat,lng,cb){
    if(!naver.maps.Service) return;
    naver.maps.Service.reverseGeocode({coords:new naver.maps.LatLng(lat,lng),orders:"roadaddr,addr"},(st,res)=>{
      const a=res?.v2?.address; if(st===naver.maps.Service.Status.OK) cb(a?.roadAddress||a?.jibunAddress);
    });
  },
  destroy(){ this.m?.destroy(); this.dot=this.circle=null; }
};

/* ===== 카카오 어댑터 ===== */
const KakaoMap = {
  async init(el,onClick){
    if(keyMissing(KAKAO_JS_KEY)) throw {msg:"카카오맵 JavaScript 키가 아직 없어요.<br>파일 위쪽 <code>KAKAO_JS_KEY</code>에 넣어 주세요."};
    if(!window.kakao?.maps){
      await loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JS_KEY)}&libraries=services&autoload=false`);
      await new Promise(r=>kakao.maps.load(r));
    }
    el.innerHTML="";
    const K=kakao.maps;
    this.m=new K.Map(el,{center:new K.LatLng(37.54,126.99),level:8});
    this.m.addControl(new K.ZoomControl(),K.ControlPosition.TOPRIGHT);
    K.event.addListener(this.m,"click",e=>onClick(e.latLng.getLat(),e.latLng.getLng()));
    this.geo=new K.services.Geocoder(); this.places=new K.services.Places();
    this.pins=[];
  },
  setCenter(lat,lng,radius){
    const K=kakao.maps, p=new K.LatLng(lat,lng);
    if(!this.dot){
      this.dot=new K.CustomOverlay({content:centerDot(),zIndex:200});
      this.circle=new K.Circle({radius,strokeWeight:2,strokeColor:COLOR.chili,strokeOpacity:.8,fillColor:COLOR.chili,fillOpacity:.08});
    }
    this.dot.setPosition(p); this.circle.setPosition(p); this.circle.setRadius(radius);
    this.dot.setMap(this.m); this.circle.setMap(this.m);
    this.m.setBounds(this.circle.getBounds());
  },
  clearCenter(){ this.dot?.setMap(null); this.circle?.setMap(null); },
  setPlaces(list,selected,onPick){
    const K=kakao.maps;
    this.pins.forEach(o=>o.setMap(null));
    this.pins=list.map(d=>{
      const on=selected===d.name;
      return new K.CustomOverlay({map:this.m,position:new K.LatLng(d.lat,d.lng),yAnchor:1.3,zIndex:on?150:100,
        content:pinEl(d,on,"kakao",onPick)});
    });
  },
  panTo(lat,lng){ this.m.panTo(new kakao.maps.LatLng(lat,lng)); },
  search(q,cb){
    const S=kakao.maps.services.Status;
    this.places.keywordSearch(q,(res,st)=>{
      if(st===S.OK&&res[0]) return cb({lat:+res[0].y,lng:+res[0].x,name:res[0].place_name});
      this.geo.addressSearch(q,(r2,st2)=>{
        cb(st2===S.OK&&r2[0]?{lat:+r2[0].y,lng:+r2[0].x,name:r2[0].address_name}:null);
      });
    });
  },
  reverse(lat,lng,cb){
    this.geo.coord2Address(lng,lat,(res,st)=>{
      if(st===kakao.maps.services.Status.OK&&res[0]) cb(res[0].road_address?.address_name||res[0].address?.address_name);
    });
  },
  destroy(){ this.pins?.forEach(o=>o.setMap(null)); this.dot?.setMap(null); this.circle?.setMap(null); this.dot=this.circle=null; this.m=null; }
};

/* ===== 지도 전환 ===== */
let map=null;
async function useProvider(pv){
  if(map){ map.destroy(); map=null; }
  state.provider=pv;
  try{ localStorage.setItem("matjip-provider",pv); }catch(e){}
  const el=$("map");
  el.innerHTML=`<div class="mapmsg">${PV_NAME[pv]}를 불러오는 중…</div>`;
  render();
  const adapter = pv==="naver"?NaverMap:KakaoMap;
  try{
    await adapter.init(el,(lat,lng)=>{
      setCenter(lat,lng,"지도에서 고른 위치");
      map?.reverse(lat,lng,n=>{ if(n&&state.center){ state.centerName=n; renderStatus(); }});
    });
    if(state.provider!==pv) return;
    map=adapter;
    if(state.center) map.setCenter(state.center.lat,state.center.lng,state.radius);
    render();
  }catch(err){
    el.innerHTML=`<div class="mapmsg"><div>${err?.msg||`${PV_NAME[pv]}를 불러오지 못했어요. 키와 등록한 도메인을 확인해 주세요.`}<br><span class="hint">지도 없이도 아래 목록과 필터는 그대로 쓸 수 있어요.</span></div></div>`;
  }
}
document.querySelectorAll(".seg [data-pv]").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.pv!==state.provider) useProvider(b.dataset.pv);
}));

function setCenter(lat,lng,name){
  state.center={lat,lng}; state.centerName=name; state.selected=null;
  if(state.sort!=="dist"){ state.sort="dist"; $("sort").value="dist"; }
  map?.setCenter(lat,lng,state.radius);
  render();
}
function clearCenter(){
  state.center=null; state.centerName=""; state.selected=null;
  map?.clearCenter(); render();
}
function focusPlace(name,fromMap){
  state.selected=name;
  const d=DATA.find(x=>x.name===name);
  if(map&&d&&!fromMap) map.panTo(d.lat,d.lng);
  render();
  const el=document.querySelector(`.card[data-name="${CSS.escape(name)}"]`);
  if(fromMap&&el) el.scrollIntoView({behavior:"smooth",block:"center"});
  else $("map").scrollIntoView({behavior:"smooth",block:"center"});
}

$("locForm").addEventListener("submit",e=>{
  e.preventDefault();
  const q=$("addr").value.trim(); if(!q) return;
  const m=q.match(/^\s*(3[3-9]\.\d+)\s*,\s*(12[4-9]\.\d+|13[0-2]\.\d+)\s*$/);
  if(m){ setCenter(+m[1],+m[2],"입력한 좌표"); return; }
  if(!map){ setStatus('<span class="hint">지도가 연결돼야 주소 검색을 할 수 있어요.</span>'); return; }
  map.search(q,r=>{
    if(r) setCenter(r.lat,r.lng,r.name);
    else setStatus(`<span class="hint">'${esc(q)}' 위치를 찾지 못했어요. ${state.provider==="naver"?"네이버 지도는 주소로만 검색돼요. 도로명·지번 주소로 다시 검색하거나 ":""}지도를 직접 클릭해 주세요.</span>`);
  });
});
$("myLoc").addEventListener("click",()=>{
  if(!navigator.geolocation){ setStatus('<span class="hint">이 브라우저에서는 내 위치를 쓸 수 없어요.</span>'); return; }
  navigator.geolocation.getCurrentPosition(
    p=>setCenter(p.coords.latitude,p.coords.longitude,"내 위치"),
    ()=>setStatus('<span class="hint">위치 권한이 없어 내 위치를 가져오지 못했어요. 지도를 클릭해 주세요.</span>'),
    {enableHighAccuracy:true,timeout:8000});
});
$("clearLoc").addEventListener("click",clearCenter);

render();
useProvider(state.provider);
</script>
</body>
</html>
