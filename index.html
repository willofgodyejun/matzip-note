<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>골목 맛집 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 간판 헤더 → 기준 한 줄 → (폰: 목록/지도 탭) → 지도 → 필터 → 카드
   데이터: 카카오맵 장소 API '음식점(FD6)' 카테고리 + 내가 직접 매긴 평가(이 브라우저에 저장) */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1C2320; --muted:#5E6A64; --line:#D9E0DB;
  --chili:#C8281E; --chili-soft:#FBE3E0; --mustard:#E0A526; --mustard-soft:#FBF0D6;
  --good:#1F7A4D; --good-soft:#DDF1E6; --star:#E0A526; --info:#2F5D8A; --info-soft:#E2ECF6;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --surface:#1D2421; --ink:#ECF1EE; --muted:#9AA8A1; --line:#2F3934;
  --chili:#F0564A; --chili-soft:#3A1F1C; --mustard:#E8B649; --mustard-soft:#3A3120;
  --good:#5CCB94; --good-soft:#1C3328; --star:#F2C230; --info:#8DB8E8; --info-soft:#1C2A38; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:32px 64px;display:flex;flex-direction:column;gap:22px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.sign{font-family:var(--display);font-weight:400;font-size:clamp(36px,7vw,60px);line-height:1;margin:0;text-wrap:balance}
.sign em{font-style:normal;color:var(--chili)}
.tag{margin:6px 0 0;color:var(--muted);max-width:54ch}
.note{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:6px 10px;border-radius:4px}

.criteria{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;align-items:center}
.criteria span{border:1px solid var(--line);border-radius:4px;padding:2px 9px;color:var(--muted);background:var(--surface)}
.criteria .head{border:0;background:none;padding-left:0;color:var(--ink);font-weight:700}
.criteria .fixed{color:var(--ink)}
.crit{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:4px;padding:2px 9px;background:var(--surface);color:var(--muted);cursor:pointer;text-decoration:line-through;text-decoration-color:var(--muted)}
.crit::before{content:"";width:9px;height:9px;border-radius:2px;border:1.5px solid var(--muted)}
.crit[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);text-decoration:none}
.crit[aria-pressed="true"]::before{background:var(--ink);border-color:var(--ink)}
.crit:hover{border-color:var(--ink)}
.crit:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.criteria .tip{border:0;background:none;padding:0;font-size:12px}

.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:15px;border:0;background:var(--surface);color:var(--ink);padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{color:var(--muted);cursor:not-allowed}

.viewtabs{display:none}
@media (max-width:640px){
  .viewtabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px}
  .viewtabs .seg{flex:1}.viewtabs .seg button{flex:1}
  body[data-view="list"] #map{display:none}
  body[data-view="map"] .filters, body[data-view="map"] #grid, body[data-view="map"] .criteria{display:none}
}

/* 지도 */
.mapbox{display:flex;flex-direction:column;gap:10px}
.maptop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.radius{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.locbar{display:flex;flex-wrap:wrap;gap:8px}
.locbar input{flex:1 1 240px;min-width:0}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
#map{width:100%;height:400px;border-radius:6px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.mapmsg{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.status{font-size:15px}
.status b{color:var(--chili);font-weight:400}
.hint{color:var(--muted);font-size:14px}

.pin{font:13px var(--body);white-space:nowrap;cursor:pointer;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin.mine{border-color:var(--good);color:var(--good)}
.pin.on{background:var(--chili);color:#fff;border-color:var(--chili)}
.pin:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.centerdot{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* 필터 */
.filters{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);width:72px;flex:none}
.chip,.btn{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip small{color:var(--muted);font-family:var(--mono);font-size:12px;margin-left:4px}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}
.chip:hover,.btn:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border-radius:6px}
.btn.small{font-size:14px;padding:4px 10px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search],select,textarea{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:7px 12px}
.tools input[type=search]{flex:1 1 220px;min-width:0}
.check{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:9px;min-width:0;scroll-margin-top:72px}
.card.on{border-color:var(--chili);box-shadow:0 0 0 1px var(--chili)}
.card.mine{box-shadow:inset 0 3px 0 var(--good)}
.card.on.mine{box-shadow:0 0 0 1px var(--chili),inset 0 3px 0 var(--good)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:23px;line-height:1.2;overflow-wrap:anywhere}
.cat{font-size:14px;color:var(--muted)}
.walk{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.info{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:8px}
.info dt{color:var(--muted)}
.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.info .mono{font-family:var(--mono);font-size:13px;user-select:all}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:13px;padding:2px 9px;border-radius:4px;background:var(--bg);color:var(--muted)}
.b.chain{background:var(--mustard-soft);color:var(--ink)}
.b.mine{background:var(--good-soft);color:var(--good);font-weight:700}
.b.low,.b.closed{background:var(--chili-soft);color:var(--chili)}
.b.old{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.b.good{background:var(--good-soft);color:var(--good)}
.b.hy{background:var(--info-soft);color:var(--info)}
.pub dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.pub dt{color:var(--muted)} .pub dd{margin:0;min-width:0}
.pub ul{margin:0;padding-left:18px}
.pub .won{font-family:var(--mono);font-size:13px}
.my{display:flex;flex-direction:column;gap:6px}
.stars{display:flex;align-items:center;gap:2px}
.stars span{font-size:13px;color:var(--muted);margin-right:6px}
.stars button{font:inherit;font-size:20px;line-height:1;background:none;border:0;padding:2px;cursor:pointer;color:var(--line)}
.stars button.on{color:var(--star)}
.stars .clear{font-size:12px;color:var(--muted);margin-left:6px;text-decoration:underline}
.memo{width:100%;min-height:0;resize:vertical;font-size:14px;padding:6px 10px}
.memo-view{margin:0;font-size:15px}
.state{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.open{font-size:13px;padding:1px 8px;border-radius:4px;font-weight:700}
.open.yes{background:var(--good-soft);color:var(--good)}
.open.brk{background:var(--mustard-soft);color:var(--ink)}
.open.no{background:var(--bg);color:var(--muted)}
.hrs{font-size:13px;color:var(--muted)}
details.hours summary{cursor:pointer;font-size:14px;color:var(--muted)}
details.hours form{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:8px;font-size:14px}
details.hours label{color:var(--muted)}
details.hours input[type=text]{font:inherit;font-size:14px;min-width:0;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:5px 10px}
details.hours .days{display:flex;flex-wrap:wrap;gap:4px}
details.hours .days label{display:flex;align-items:center;gap:2px;color:var(--ink)}
details.hours .acts{grid-column:1/-1;display:flex;gap:8px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:auto}
.links button,.links a{font:inherit;background:none;border:0;padding:0;color:var(--chili);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 16px;border:1.5px dashed var(--line);border-radius:6px}
.empty b{color:var(--ink);font-weight:400}
.backup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100% - 32px);word-break:break-all}
@media (max-width:640px){#map{height:calc(100vh - 300px);min-height:320px}.row .lbl{width:100%}}
/* 카드 = 누르면 하단 시트가 열리는 버튼 */
.card{cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--ink)}
.card:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.card .addr{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.card .more{margin-top:auto;font-size:14px;color:var(--chili)}
/* 하단 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:min(82vh,760px);overflow:auto;overscroll-behavior:contain;
  background:var(--surface);color:var(--ink);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
@media (min-width:720px){.sheet{left:50%;right:auto;width:680px;transform:translateX(-50%)}}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]){animation:sheetUp .22s ease-out}.scrim:not([hidden]){animation:fade .2s}}
@keyframes sheetUp{from{translate:0 40px;opacity:.4}to{translate:0 0;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.2;overflow-wrap:anywhere}
.sheet .x{font:inherit;font-size:22px;line-height:1;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px}
.sheet .sbody{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.sheet .sec{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.sheet .sec h4{margin:0;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:.04em}
.sheet .acts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.sheet .acts2 a,.sheet .acts2 button{font:inherit;font-size:15px;text-align:center;text-decoration:none;border:1.5px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.sheet .acts2 .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet .acts2 a:hover,.sheet .acts2 button:hover{border-color:var(--ink)}
.sheet .rowcopy{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sheet .rowcopy button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--muted);cursor:pointer;flex:none}
body.sheet-open{overflow:hidden}
</style>
<script>
  // ▼ 발급받은 키를 넣으세요. 음식점 데이터는 카카오 키로만 불러올 수 있어요.
  const NAVER_KEY_ID = "YOUR_NAVER_CLIENT_ID";      // 네이버 클라우드 플랫폼 · Maps Client ID (지도 표시용, 선택)
  const KAKAO_JS_KEY = "0529da52a9f8f054432381911324b332"; // 카카오 디벨로퍼스 · JavaScript 키 (필수)
</script>
</head>
<body data-view="list">
<div class="wrap">
  <header>
    <div>
      <h1 class="sign">골목 <em>맛집</em> 수첩</h1>
      <p class="tag">카카오맵에 등록된 주변 음식점 중 체인점을 뺀 동네 가게를 걸어갈 수 있는 순서로 보여 드려요. 직접 가 보고 별점을 남기면 내 맛집이 쌓여요.</p>
    </div>
    <span class="note">데이터 · 카카오맵 장소 정보</span>
  </header>

  <div class="criteria" id="criteria"></div>

  <div class="viewtabs"><div class="seg" role="group" aria-label="보기 전환">
    <button type="button" data-view="list">목록</button><button type="button" data-view="map">지도</button>
  </div></div>

  <section class="mapbox" aria-label="위치 설정">
    <div class="maptop">
      <div class="seg" role="group" aria-label="지도 선택" id="pvSeg">
        <button type="button" data-pv="kakao">카카오맵</button>
        <button type="button" data-pv="naver">네이버 지도</button>
      </div>
      <div class="radius"><span>반경</span><div class="seg" role="group" aria-label="반경 선택" id="radiusSeg"></div></div>
    </div>
    <form class="locbar" id="locForm">
      <input type="search" id="addr" placeholder="주소나 장소 검색 (예: 홍대입구역, 성수동)" aria-label="위치 검색">
      <button class="btn primary" type="submit">이 위치로</button>
      <button class="btn" type="button" id="myLoc">내 위치</button>
    </form>
    <div class="quick" id="quick"><span>바로 가기</span></div>
    <div id="map"><div class="mapmsg">지도를 불러오는 중…</div></div>
    <div class="status" id="status"></div>
  </section>

  <section class="filters" aria-label="필터">
    <div class="row" id="catRow"><span class="lbl">종류</span></div>
    <div class="tools">
      <input type="search" id="q" placeholder="가게 이름, 음식 종류로 찾기" aria-label="검색">
      <select id="sort" aria-label="정렬">
        <option value="dist">가까운 순</option>
        <option value="my">내 별점 순</option>
        <option value="old">오래된 가게 순</option>
        <option value="name">이름순</option>
      </select>
      <label class="check"><input type="checkbox" id="openOnly"> 지금 영업 중만</label>
    </div>
    <div class="count" id="count"></div>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>

  <div class="backup">
    <span>내 별점, 메모, 영업시간은 이 브라우저에만 저장돼요.</span>
    <button class="btn small" type="button" id="exportBtn">내 평가 내보내기</button>
    <label class="btn small" for="importFile" style="cursor:pointer">가져오기</label>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="handle" aria-hidden="true"></div>
  <div id="sheetBody"></div>
</section>

<script>
/* ===== 기준 — 카카오 장소 API로 확인할 수 있는 정보만 씁니다 =====
   (평점, 리뷰 수, 최근 평점은 공개 API에 없어서 쓰지 않아요) */
const CRITERIA = {
  category: "FD6",        // 카카오 카테고리: 음식점
  excludeChain: true,     // 지점명(○○ 홍대점 등)이 붙은 체인점은 기본으로 숨김
  needPhone: true,        // 전화번호가 등록된 곳만
  needRoadAddr: true,     // 도로명 주소가 등록된 곳만
  mineMin: 4              // 직접 가서 이 별점 이상을 준 곳 = '내 맛집'
};
const RADII = [500, 1000, 3000, 5000];
const MAX_PAGES = 3;              // 카카오 API는 한 번에 최대 45곳(15곳 × 3쪽)
const WALK_M_PER_MIN = 80;        // 도보 시간 (직선거리 기준이라 실제보다 짧을 수 있음)
const QUICK = ["홍대입구역","강남역","성수역","여의도역","광화문역"];
const FIXED_CATS = ["한식","중식","일식","양식","카페"];   // 결과가 없어도 항상 보이는 종류
const DAYS = ["일","월","화","수","목","금","토"];
const NOT_BRANCH = new Set(["반점","주점","본점","맛점","정점"]);

const keyMissing = k=>!k || /^YOUR_/.test(k);
const HAS_KEY = {naver:!keyMissing(NAVER_KEY_ID), kakao:!keyMissing(KAKAO_JS_KEY)};
const PV_NAME = {naver:"네이버 지도", kakao:"카카오맵"};
const $ = id=>document.getElementById(id);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDist = m=>m<1000?`${Math.round(m/10)*10}m`:`${(m/1000).toFixed(1)}km`;
const walkMin = m=>Math.max(1,Math.round(m/WALK_M_PER_MIN));
const kmLabel = m=>m<1000?`${m}m`:`${m/1000}km`;

/* ===== 내 평가 (이 브라우저에 저장) ===== */
let MY = {};
try{ MY = JSON.parse(localStorage.getItem("matjip-my")||"{}")||{}; }catch(e){ MY={}; }
const saveMy = ()=>{ try{ localStorage.setItem("matjip-my", JSON.stringify(MY)); }catch(e){} };
const myOf = id=>MY[id]||null;
const isMine = p=>(myOf(p.id)?.stars||0)>=CRITERIA.mineMin;

/* ===== 영업시간 (카카오 API에 없어 직접 입력) ===== */
const TIME_RE=/^\s*(\d{1,2}):(\d{2})\s*[-–~]\s*(\d{1,2}):(\d{2})\s*$/;
function span(str){ const m=str.match(TIME_RE); const a=+m[1]*60+ +m[2], b=+m[3]*60+ +m[4]; return [a, b<=a?b+1440:b]; }
const inSpan=(now,[a,b])=>(now>=a&&now<b)||(now+1440>=a&&now+1440<b);
const normTime=str=>{ const m=str.match(TIME_RE); return m?`${m[1].padStart(2,"0")}:${m[2]}–${m[3].padStart(2,"0")}:${m[4]}`:null; };
function openState(p, at=new Date()){
  const h=myOf(p.id)?.hours; if(!h?.open) return null;
  const now=at.getHours()*60+at.getMinutes();
  if((h.off||[]).includes(at.getDay())) return {key:"no",label:`오늘 휴무 (${DAYS[at.getDay()]})`};
  if(!inSpan(now,span(h.open))) return {key:"no",label:"영업 종료"};
  if(h.brk&&inSpan(now,span(h.brk))) return {key:"brk",label:`브레이크 ~${h.brk.split("–")[1]}`};
  return {key:"yes",label:"영업 중"};
}

/* ===== 카카오 결과 → 가게 ===== */
function branchOf(name){
  const parts=name.trim().split(/\s+/);
  if(parts.length<2) return null;
  const last=parts.at(-1);
  return /점$/.test(last) && last.length>=2 && !NOT_BRANCH.has(last) ? last : null;
}
function toPlace(r){
  const seg=(r.category_name||"").split(">").map(s=>s.trim()).filter(Boolean);
  return {
    id:r.id, name:r.place_name, url:r.place_url,
    top:seg[1]||"기타", detail:seg.slice(2).join(" · "),
    phone:r.phone||"", road:r.road_address_name||"", addr:r.address_name||"",
    lat:+r.y, lng:+r.x, dist:r.distance!==""&&r.distance!=null?+r.distance:null,
    branch:branchOf(r.place_name||"")
  };
}
function failures(p){
  const f=[];
  if(state.crit.phone&&!p.phone) f.push("전화번호 없음");
  if(state.crit.road&&!p.road) f.push("도로명 주소 없음");
  return f;
}
const passes = p=>failures(p).length===0;

const state = {places:[], loading:false, error:"", center:null, centerName:"", radius:1000,
  cat:"전체", q:"", sort:"dist", openOnly:false, catPlaces:{}, selected:null,

try{

/* ===== 카카오 SDK (데이터용, 지도와 별개로 로드) ===== */
function loadScript(src){
  return new Promise((ok,fail)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=fail;document.head.appendChild(s);});
}
let kakaoReady=null;
function ensureKakao(){
  if(!HAS_KEY.kakao) return Promise.reject(new Error("no-key"));
  if(!kakaoReady) kakaoReady = (async()=>{
    if(!window.kakao?.maps?.services){
      await loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JS_KEY)}&libraries=services&autoload=false`);
      await new Promise(r=>kakao.maps.load(r));
    }
    return {places:new kakao.maps.services.Places(), geo:new kakao.maps.services.Geocoder()};
  })();
  return kakaoReady;
}

/* 반경 안의 음식점을 가까운 순으로 최대 45곳 */
let searchSeq=0;
async function loadPlaces(){
  if(!state.center) return;
  state.catPlaces={};
  const seq=++searchSeq;
  state.loading=true; state.error=""; render();
  try{
    const {places}=await ensureKakao();
    const S=kakao.maps.services;
    const all=[];
    await new Promise(done=>{
      places.categorySearch(CRITERIA.category,(data,status,pg)=>{
        if(seq!==searchSeq) return done();
        if(status===S.Status.OK){ all.push(...data); if(pg.hasNextPage&&pg.current<MAX_PAGES) return pg.nextPage(); }
        else if(status===S.Status.ERROR){ state.error="카카오 장소 검색에 실패했어요. 키, 등록한 도메인, 카카오맵 사용 설정을 확인해 주세요."; }
        done();
      },{location:new kakao.maps.LatLng(state.center.lat,state.center.lng), radius:state.radius, sort:S.SortBy.DISTANCE});
    });
    if(seq!==searchSeq) return;
    const seen=new Set();
    state.places=all.map(toPlace).filter(p=>!seen.has(p.id)&&seen.add(p.id));
    state.capped = all.length>=MAX_PAGES*15;
    await attachPublic(state.places);
    if(seq!==searchSeq) return;
  }catch(e){
    state.places=[];
    state.error = HAS_KEY.kakao ? "카카오 장소 정보를 불러오지 못했어요. 네트워크와 키 설정을 확인해 주세요." : "카카오 JavaScript 키가 없어 음식점 정보를 불러올 수 없어요.";
  }
  if(seq===searchSeq){ state.loading=false; render(); if(state.cat!=="전체") loadCat(state.cat); }
}
/* 종류를 고르면 그 종류만 따로 검색 (전체 45곳 제한에 묻힌 가게까지) */
const CAFE_CODE = "CE7";   // 카카오에서 카페는 음식점(FD6)과 다른 카테고리
async function loadCat(cat){
  if(!state.center||state.catPlaces[cat]) return;
  if(cat!=="카페"&&!state.capped) return;
  const seq=searchSeq; state.catPlaces[cat]="loading"; render();
  try{
    const {places}=await ensureKakao(); const S=kakao.maps.services; const all=[];
    const opts={location:new kakao.maps.LatLng(state.center.lat,state.center.lng), radius:state.radius, sort:S.SortBy.DISTANCE};
    await new Promise(done=>{
      const cb=(data,status,pg)=>{
        if(seq!==searchSeq) return done();
        if(status===S.Status.OK){ all.push(...data); if(pg.hasNextPage&&pg.current<MAX_PAGES) return pg.nextPage(); }
        done();
      };
      if(cat==="카페") places.categorySearch(CAFE_CODE,cb,opts);
      else places.keywordSearch(cat,cb,{...opts, category_group_code:CRITERIA.category});
    });
    if(seq!==searchSeq) return;
    const got=all.map(toPlace).map(p=>cat==="카페"?{...p, top:"카페", detail:p.detail||""}:p).filter(p=>p.top===cat);
    await attachPublic(got);
    if(seq!==searchSeq) return;
    state.catPlaces[cat]=got;
  }catch(e){ state.catPlaces[cat]=[]; }
  render();
}
function pool(){
  const extra=Array.isArray(state.catPlaces[state.cat])?state.catPlaces[state.cat]:[];
  if(!extra.length) return state.places;
  const seen=new Set(state.places.map(p=>p.id));
  return [...state.places, ...extra.filter(p=>!seen.has(p.id))];
}

/* ===== 공공데이터 (data/public, scripts/build-public-data.mjs 로 생성) =====
   인허가(영업상태·인허가일자), 착한가격업소, 위생등급을 가게 이름 + 주소(또는 좌표)로 카카오 결과와 맞춥니다. */
const OLD_YEARS = 10;
let PUB=null; const SHARDS={};
const SIDO={서울특별시:"서울",부산광역시:"부산",대구광역시:"대구",인천광역시:"인천",광주광역시:"광주",대전광역시:"대전",울산광역시:"울산",세종특별자치시:"세종",경기도:"경기",강원특별자치도:"강원",강원도:"강원",충청북도:"충북",충청남도:"충남",전북특별자치도:"전북",전라북도:"전북",전라남도:"전남",경상북도:"경북",경상남도:"경남",제주특별자치도:"제주"};
function normAddr(a){ if(!a) return ""; const t=a.replace(/\(.*?\)/g," ").split(",")[0].replace(/\s+/g," ").trim().split(" "); t[0]=SIDO[t[0]]||t[0]; return t.join(" "); }
function roadKey(a){ const m=normAddr(a).match(/^(\S+ \S+(?: \S+구)?) .*?(\S+(?:로|길)(?:\d+(?:번)?길)?) (\d+(?:-\d+)?)/); return m?`${m[1]}|${m[2]}|${m[3]}`:""; }
function jibunKey(a){ const m=normAddr(a).match(/^(\S+ \S+(?: \S+구)?) .*?(\S+(?:동|가|리|읍|면)) (?:산\s?)?(\d+(?:-\d+)?)/); return m?`${m[1]}|${m[2]}|${m[3]}`:""; }
const shardOf=a=>{ const t=normAddr(a).split(" "); return t.length>=2?`${t[0]} ${t[1]}`:""; };
const normName=n=>(n||"").replace(/\(.*?\)|㈜|주식회사/g,"").replace(/[\s·.,'"&\-_/]/g,"").toLowerCase();
function sameName(a,b){ const A=normName(a),B=normName(b); if(!A||!B) return false; if(A===B) return true; return Math.min(A.length,B.length)>=2&&(A.includes(B)||B.includes(A)); }
function meters(a,b,c,d){ const R=6371000,r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r; return Math.hypot(x,y)*R; }

async function loadPubIndex(){
  try{ const r=await fetch("data/public/index.json",{cache:"no-cache"}); if(r.ok){ const j=await r.json(); if(j?.shards?.length) PUB=j; } }catch(e){}
  if(PUB&&state.places.length){ await attachPublic(state.places); render(); renderSheet(); }
  else render();
}
function indexShard(j){
  const idx={};
  for(const kind of ["biz","good","hy"]){
    const rk={}, jk={}, grid={}, list=j[kind]||[];
    for(const r of list){
      if(r.rk) (rk[r.rk]||=[]).push(r);
      if(r.jk) (jk[r.jk]||=[]).push(r);
      if(r.la!=null&&r.lo!=null) (grid[`${Math.round(r.la*1000)},${Math.round(r.lo*1000)}`]||=[]).push(r);
    }
    idx[kind]={rk,jk,grid};
  }
  return idx;
}
async function ensureShards(keys){
  await Promise.all([...new Set(keys)].filter(k=>k&&PUB.shards.includes(k)&&!(k in SHARDS)).map(async k=>{
    SHARDS[k]=null;
    try{ const r=await fetch(`data/public/shards/${encodeURIComponent(k.replace(/\s+/g,"_"))}.json`); if(r.ok) SHARDS[k]=indexShard(await r.json()); }catch(e){}
  }));
}
function findIn(ix,p){
  if(!ix) return [];
  const byAddr=[...(ix.rk[roadKey(p.road)]||[]), ...(ix.jk[jibunKey(p.addr)]||[])].filter(r=>sameName(r.n,p.name));
  if(byAddr.length) return byAddr;
  const out=[], ci=Math.round(p.lat*1000), cj=Math.round(p.lng*1000);
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++) for(const r of ix.grid[`${ci+i},${cj+j}`]||[])
    if(meters(p.lat,p.lng,r.la,r.lo)<=60&&sameName(r.n,p.name)) out.push(r);
  return out;
}
async function attachPublic(list){
  if(!PUB||!list.length) return;
  await ensureShards(list.map(p=>shardOf(p.addr||p.road)));
  for(const p of list){
    const sh=SHARDS[shardOf(p.addr||p.road)];
    if(!sh){ p.pub=null; continue; }
    const biz=findIn(sh.biz,p), open=biz.filter(r=>r.s===1).sort((a,b)=>(a.d||"9").localeCompare(b.d||"9"));
    const closed=biz.filter(r=>r.s===0).sort((a,b)=>(b.c||"").localeCompare(a.c||""));
    p.pub={
      biz: open[0]?{open:true,since:open[0].d}:closed[0]?{open:false,since:closed[0].d,closedAt:closed[0].c}:null,
      good: findIn(sh.good,p)[0]||null,
      hy: findIn(sh.hy,p).sort((a,b)=>b.g-a.g)[0]||null
    };
  }
}
const ymdDot=d=>d&&d.length>=8?`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`:"";
function yearsOf(p){ const d=p.pub?.biz?.open&&p.pub.biz.since; if(!d) return null; const t=new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8)); return Math.floor((Date.now()-t)/(365.25*864e5)); }
const isClosed=p=>p.pub?.biz&&!p.pub.biz.open;
const HY_LABEL={3:"매우 우수",2:"우수",1:"좋음"};
function pubOK(p){
  const C=state.crit;
  if(!PUB) return true;
  if(C.closed&&isClosed(p)) return false;
  if(C.old&&!((yearsOf(p)??0)>=OLD_YEARS)) return false;
  if(C.good&&!p.pub?.good) return false;
  if(C.hy&&!p.pub?.hy) return false;
  return true;
}
function pubBadges(p){
  if(!p.pub) return "";
  const y=yearsOf(p);
  return [
    isClosed(p)?`<span class="b closed">폐업 신고${p.pub.biz.closedAt?` ${ymdDot(p.pub.biz.closedAt).slice(0,7)}`:""}</span>`:"",
    y!=null&&y>=OLD_YEARS?`<span class="b old">${y}년 된 가게</span>`:"",
    p.pub.good?'<span class="b good">착한가격</span>':"",
    p.pub.hy?`<span class="b hy">위생 ${"★".repeat(p.pub.hy.g)} ${HY_LABEL[p.pub.hy.g]}</span>`:""
  ].join("");
}
function pubSection(p){
  if(!PUB) return "";
  const b=p.pub?.biz, g=p.pub?.good, h=p.pub?.hy, y=yearsOf(p);
  const won=v=>v?`${(+v).toLocaleString("ko-KR")}원`:"";
  return `<div class="sec pub"><h4>공공데이터</h4><dl>
    <dt>영업 신고</dt><dd>${b?(b.open?`영업 중 · ${ymdDot(b.since)} 인허가${y!=null?` (업력 ${y}년)`:""}`:`폐업 신고 ${ymdDot(b.closedAt)}`):"일치하는 기록을 찾지 못했어요"}</dd>
    <dt>착한가격</dt><dd>${g?(g.m?.length?`<ul>${g.m.map(([m,v])=>`<li>${esc(m)} <span class="won">${won(v)}</span></li>`).join("")}</ul>`:"지정 업소"):"지정 기록 없음"}</dd>
    <dt>위생등급</dt><dd>${h?`${"★".repeat(h.g)} ${HY_LABEL[h.g]}${h.d?` · ${ymdDot(h.d)} 지정`:""}`:"지정 기록 없음"}</dd>
  </dl><span class="hint">${esc(PUB.updated)} 기준 · 행정안전부·지자체·식품의약품안전처 공공데이터를 가게 이름과 주소로 맞춘 결과라 틀릴 수 있어요.</span></div>`;
}

/* ===== 목록 ===== */
function visible(){
  const q=state.q.toLowerCase();
  return pool().filter(p=>passes(p)&&pubOK(p)
    &&(!state.crit.chain||!p.branch)
    &&(!state.crit.mine||isMine(p))
    &&(!state.openOnly||openState(p)?.key==="yes")
    &&(state.cat==="전체"||p.top===state.cat)
    &&(!q||[p.name,p.top,p.detail].join(" ").toLowerCase().includes(q)));
}
function sortList(list){
  const st=p=>myOf(p.id)?.stars||0;
  const cmp={dist:(a,b)=>(a.dist??1e9)-(b.dist??1e9),
    my:(a,b)=>st(b)-st(a)||(a.dist??1e9)-(b.dist??1e9),
    old:(a,b)=>(yearsOf(b)??-1)-(yearsOf(a)??-1)||(a.dist??1e9)-(b.dist??1e9),
    name:(a,b)=>a.name.localeCompare(b.name,"ko")}[state.sort];
  return list.sort(cmp);
}

function render(){
  document.querySelectorAll("#pvSeg [data-pv]").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.pv===state.provider);
    b.disabled=!HAS_KEY[b.dataset.pv]; b.title=b.disabled?"키가 없어 쓸 수 없어요":"";
  });
  document.querySelectorAll("#radiusSeg button").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.r===state.radius));

  // 종류 칩: 불러온 결과에서 만들기
  const keep=p=>passes(p)&&pubOK(p)&&(!state.crit.chain||!p.branch)&&(!state.crit.mine||isMine(p))&&(!state.openOnly||openState(p)?.key==="yes");
  const base=state.places.filter(keep);
  const counts={}; base.forEach(p=>counts[p.top]=(counts[p.top]||0)+1);
  for(const [c,arr] of Object.entries(state.catPlaces)) if(Array.isArray(arr)){
    const ids=new Set(base.filter(p=>p.top===c).map(p=>p.id)); counts[c]=(counts[c]||0)+arr.filter(p=>keep(p)&&!ids.has(p.id)).length; }
  const others=Object.keys(counts).filter(c=>!FIXED_CATS.includes(c)).sort((a,b)=>counts[b]-counts[a]);
  const showN=c=>!state.center||state.loading?"":c==="전체"?base.length:state.catPlaces[c]==="loading"?"…":(c==="카페"&&!state.catPlaces[c])?"":(counts[c]||0);
  $("catRow").innerHTML='<span class="lbl">종류</span>'+["전체",...FIXED_CATS,...others].map(c=>
    `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c===state.cat}">${esc(c)}<small>${showN(c)}</small></button>`).join("");

  const list=sortList(visible());
  const total=state.places.length, chainN=state.places.filter(p=>passes(p)&&p.branch).length, failN=state.places.filter(p=>!passes(p)).length;
  const C=state.crit;
  $("criteria").innerHTML =
    `<span class="head">고르는 기준</span><span class="fixed">카카오맵 음식점·카페</span>`
    + `<button type="button" class="crit" data-crit="chain" aria-pressed="${C.chain}">체인점 제외</button>`
    + `<button type="button" class="crit" data-crit="phone" aria-pressed="${C.phone}">전화번호 등록된 곳만</button>`
    + `<button type="button" class="crit" data-crit="road" aria-pressed="${C.road}">도로명 주소 등록된 곳만</button>`
    + `<button type="button" class="crit" data-crit="mine" aria-pressed="${C.mine}">내 맛집만 (직접 가서 ★${CRITERIA.mineMin} 이상)</button>`
    + (PUB?`<button type="button" class="crit" data-crit="closed" aria-pressed="${C.closed}">폐업 신고된 곳 제외</button>`
      + `<button type="button" class="crit" data-crit="old" aria-pressed="${C.old}">${OLD_YEARS}년 넘은 가게만</button>`
      + `<button type="button" class="crit" data-crit="good" aria-pressed="${C.good}">착한가격업소만</button>`
      + `<button type="button" class="crit" data-crit="hy" aria-pressed="${C.hy}">위생등급 받은 곳만</button>`:"")
    + `<span class="tip hint">눌러서 켜고 끌 수 있어요</span>`;
  if(!state.center){
    $("count").textContent="";
    $("grid").innerHTML=`<div class="empty"><b>위치를 정하면 주변 음식점을 불러와요.</b><br>주소를 검색하거나, 지도를 클릭하거나, 위의 바로 가기를 눌러 보세요.</div>`;
  }else if(state.loading){
    $("count").textContent="불러오는 중…";
    $("grid").innerHTML=`<div class="empty">카카오맵에서 반경 ${kmLabel(state.radius)} 안의 음식점을 불러오는 중이에요.</div>`;
  }else if(state.error){
    $("count").textContent="";
    $("grid").innerHTML=`<div class="empty"><b>${esc(state.error)}</b></div>`;
  }else{
    $("count").textContent=`카카오맵 음식점 ${total}곳${state.capped?"(가까운 순 최대치)":""} 중 ${list.length}곳 표시`
      +(C.chain?` · 체인점 ${chainN}곳 숨김`:"")+(failN?` · 정보 미등록 ${failN}곳 제외`:"")
      +(PUB&&C.closed?((n=>n?` · 폐업 신고 ${n}곳 숨김`:"")(state.places.filter(isClosed).length)):"")
      +(state.openOnly?" · 영업시간을 입력한 곳만 판단해요":"");
    $("grid").innerHTML=list.length?list.map(card).join(""):
      `<div class="empty"><b>조건에 맞는 가게가 없어요.</b><br>${state.openOnly?"'지금 영업 중만'은 영업시간을 입력한 가게에만 적용돼요. ":""}${state.crit.mine?"'내 맛집만'을 끄거나 ":""}반경을 넓히거나 종류를 '전체'로 바꿔 보세요.</div>`;
  }
  renderStatus();
  if(map) map.setPlaces(list, state.selected, id=>focusPlace(id,true));
}

let sheetId=null, lastFocus=null;
function renderSheet(){
  if(!sheetId) return;
  const p=pool().find(x=>x.id===sheetId);
  if(!p) return closeSheet();
  const keepFocus=document.activeElement?.closest?.("#sheet")?(document.activeElement.dataset.star||document.activeElement.dataset.close!==undefined&&"close"):null;
  $("sheetBody").innerHTML=sheetHtml(p);
  if(keepFocus) $("sheet").querySelector(keepFocus==="close"?"[data-close]":`[data-star="${keepFocus}"]`)?.focus();
}
function openSheet(id){
  lastFocus=document.activeElement;
  sheetId=id; state.selected=id;
  render(); renderSheet();
  $("scrim").hidden=false; $("sheet").hidden=false; $("sheet").scrollTop=0;
  document.body.classList.add("sheet-open");
  $("sheet").querySelector("[data-close]")?.focus();
}
function closeSheet(){
  if(!sheetId) return;
  sheetId=null; $("scrim").hidden=true; $("sheet").hidden=true;
  document.body.classList.remove("sheet-open");
  if(lastFocus&&document.contains(lastFocus)) lastFocus.focus();
  else document.getElementById("k-"+state.selected)?.focus();
}
$("scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{
  if(!sheetId) return;
  if(e.key==="Escape"){ e.preventDefault(); closeSheet(); return; }
  if(e.key==="Tab"){ // 시트 안에서만 포커스 이동
    const f=[...$("sheet").querySelectorAll('a[href],button:not([disabled]),input,textarea,summary,select')].filter(x=>x.offsetParent!==null);
    if(!f.length) return; const first=f[0], last=f.at(-1);
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

async function searchLocation(q){
  const m=q.match(/^\s*(3[3-9]\.\d+)\s*,\s*(12[4-9]\.\d+|13[0-2]\.\d+)\s*$/);
  if(m) return setCenter(+m[1],+m[2],"입력한 좌표");
  try{
    const {places,geo}=await ensureKakao(); const S=kakao.maps.services.Status;
    places.keywordSearch(q,(res,st)=>{
      if(st===S.OK&&res[0]) return setCenter(+res[0].y,+res[0].x,res[0].place_name);
      geo.addressSearch(q,(r2,st2)=>{
        if(st2===S.OK&&r2[0]) setCenter(+r2[0].y,+r2[0].x,r2[0].address_name);
        else $("status").innerHTML=`<span class="hint">'${esc(q)}' 위치를 찾지 못했어요. 다른 이름으로 검색하거나 지도를 직접 클릭해 주세요.</span>`;
      });
    });
  }catch(e){ $("status").innerHTML='<span class="hint">카카오에 연결할 수 없어 위치를 검색하지 못했어요.</span>'; }
}
async function reverseName(lat,lng){
  try{ const {geo}=await ensureKakao(); geo.coord2Address(lng,lat,(res,st)=>{
    if(st===kakao.maps.services.Status.OK&&res[0]&&state.center){ state.centerName=res[0].road_address?.address_name||res[0].address?.address_name; renderStatus(); }
  }); }catch(e){}
}

function centerDot(){ const el=document.createElement("div"); el.className="centerdot"; return el; }
const CIRCLE="#C8281E";

const KakaoMap={
  async init(el,onClick){
    await ensureKakao(); el.innerHTML="";
    const K=kakao.maps;
    this.m=new K.Map(el,{center:new K.LatLng(37.5665,126.9780),level:7});
    this.m.addControl(new K.ZoomControl(),K.ControlPosition.TOPRIGHT);
    K.event.addListener(this.m,"click",e=>onClick(e.latLng.getLat(),e.latLng.getLng()));
    this.pins=[];
  },
  setCenter(lat,lng,radius){
    const K=kakao.maps,p=new K.LatLng(lat,lng);
    if(!this.dot){ this.dot=new K.CustomOverlay({content:centerDot(),zIndex:200});
      this.circle=new K.Circle({radius,strokeWeight:2,strokeColor:CIRCLE,strokeOpacity:.8,fillColor:CIRCLE,fillOpacity:.06}); }
    this.dot.setPosition(p); this.circle.setPosition(p); this.circle.setRadius(radius);
    this.dot.setMap(this.m); this.circle.setMap(this.m); this.m.setBounds(this.circle.getBounds());
  },
  setPlaces(list,selected,onPick){
    const K=kakao.maps; this.pins.forEach(o=>o.setMap(null));
    this.pins=list.map(p=>new K.CustomOverlay({map:this.m,position:new K.LatLng(p.lat,p.lng),yAnchor:1.3,zIndex:selected===p.id?150:isMine(p)?120:100,content:pinEl(p,selected===p.id,onPick)}));
  },
  panTo(lat,lng){ this.m.panTo(new kakao.maps.LatLng(lat,lng)); },
  relayout(){ try{ this.m?.relayout(); if(this.circle?.getMap()) this.m.setBounds(this.circle.getBounds()); }catch(e){} },
  destroy(){ this.pins?.forEach(o=>o.setMap(null)); this.dot?.setMap(null); this.circle?.setMap(null); this.dot=this.circle=null; this.m=null; }
};

  },
  setCenter(lat,lng,radius){
    const N=naver.maps,p=new N.LatLng(lat,lng);
    if(!this.dot){ this.dot=new N.Marker({position:p,zIndex:200,icon:{content:centerDot(),anchor:new N.Point(9,9)}});
      this.circle=new N.Circle({center:p,radius,strokeColor:CIRCLE,strokeWeight:2,strokeOpacity:.8,fillColor:CIRCLE,fillOpacity:.06,clickable:false}); }
    this.dot.setPosition(p); this.circle.setCenter(p); this.circle.setRadius(radius);
    this.dot.setMap(this.m); this.circle.setMap(this.m); this.m.fitBounds(this.circle.getBounds());
  },
  setPlaces(list,selected,onPick){
    const N=naver.maps; this.pins.forEach(m=>m.setMap(null));
    this.pins=list.map(p=>new N.Marker({map:this.m,position:new N.LatLng(p.lat,p.lng),zIndex:selected===p.id?150:isMine(p)?120:100,icon:{content:pinEl(p,selected===p.id,onPick),anchor:new N.Point(0,30)}}));
  },
  panTo(lat,lng){ this.m.panTo(new naver.maps.LatLng(lat,lng)); },
  relayout(){ try{ this.m?.autoResize(); }catch(e){} },
  destroy(){ this.m?.destroy(); this.dot=this.circle=null; }
};

let map=null;
async function useProvider(pv){
  if(map){ map.destroy(); map=null; }
  state.provider=pv; const el=$("map");
  if(!pv){ el.hidden=true; render(); return; }
  el.hidden=false;
  try{ localStorage.setItem("matjip-provider",pv); }catch(e){}
  el.innerHTML=`<div class="mapmsg">${PV_NAME[pv]}를 불러오는 중…</div>`;
  render();
  const adapter=pv==="naver"?NaverMap:KakaoMap;
  try{
    await adapter.init(el,(lat,lng)=>{ setCenter(lat,lng,"지도에서 고른 위치"); reverseName(lat,lng); });
    if(state.provider!==pv) return;
    map=adapter;
    if(state.center) map.setCenter(state.center.lat,state.center.lng,state.radius);
    render();
  }catch(e){
    el.innerHTML=`<div class="mapmsg"><div>${PV_NAME[pv]}를 불러오지 못했어요. 키와 등록한 도메인을 확인해 주세요.<br><span class="hint">주소 검색과 바로 가기로도 목록은 볼 수 있어요.</span></div></div>`;
  }
}
document.querySelectorAll("#pvSeg [data-pv]").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.pv!==state.provider&&HAS_KEY[b.dataset.pv]) useProvider(b.dataset.pv);
}));

setView("list");
render();
loadPubIndex();
useProvider(state.provider);
// 영업 상태를 1분마다 갱신 (입력 중이거나 펼쳐 둔 폼이 있으면 건너뜀)
setInterval(()=>{ if(!sheetId) render(); }, 60000);
</script>
