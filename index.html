<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>골목 맛집 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 간판 헤더 → 기준 한 줄 → (폰: 목록/지도 탭) → 지도 → 필터 → 카드. 기본은 점심 모드 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1C2320; --muted:#5E6A64; --line:#D9E0DB;
  --chili:#C8281E; --chili-soft:#FBE3E0; --mustard:#E0A526; --mustard-soft:#FBF0D6;
  --naver:#03A94D; --kakao:#C99A00; --good:#1F7A4D; --good-soft:#DDF1E6;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141917; --surface:#1D2421; --ink:#ECF1EE; --muted:#9AA8A1; --line:#2F3934;
  --chili:#F0564A; --chili-soft:#3A1F1C; --mustard:#E8B649; --mustard-soft:#3A3120;
  --naver:#3DD27F; --kakao:#F2C230; --good:#5CCB94; --good-soft:#1C3328; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:32px 64px;display:flex;flex-direction:column;gap:22px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px;border-bottom:3px solid var(--ink);padding-bottom:16px}
.sign{font-family:var(--display);font-weight:400;font-size:clamp(36px,7vw,60px);line-height:1;margin:0;text-wrap:balance}
.sign em{font-style:normal;color:var(--chili)}
.tag{margin:6px 0 0;color:var(--muted);max-width:52ch}
.note{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px dashed var(--line);padding:6px 10px;border-radius:4px}
.warn{margin:0;padding:10px 12px;border-radius:6px;background:var(--mustard-soft);font-size:14px}
.warn code{font-family:var(--mono);font-size:12px}

.criteria{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;align-items:center}
.criteria span{border:1px solid var(--line);border-radius:4px;padding:2px 9px;color:var(--muted);background:var(--surface)}
.criteria span b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.criteria .head{border:0;background:none;padding-left:0;color:var(--ink);font-weight:700}

.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:15px;border:0;background:var(--surface);color:var(--ink);padding:6px 14px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{color:var(--muted);cursor:not-allowed}

/* 폰 전용 목록/지도 탭 */
.viewtabs{display:none}
@media (max-width:640px){
  .viewtabs{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px}
  .viewtabs .seg{flex:1}.viewtabs .seg button{flex:1}
  body[data-view="list"] .mapbox{display:none}
  body[data-view="map"] .filters, body[data-view="map"] #grid, body[data-view="map"] .criteria{display:none}
}

/* 지도 */
.mapbox{display:flex;flex-direction:column;gap:10px}
.mapbox.nomap #map,.mapbox.nomap .locbar{display:none}
.maptop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.radius{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.locbar{display:flex;flex-wrap:wrap;gap:8px}
.locbar input{flex:1 1 240px;min-width:0}
#map{width:100%;height:400px;border-radius:6px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.mapmsg{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.status{font-size:15px}
.status b{color:var(--chili);font-weight:400}
.hint{color:var(--muted);font-size:14px}

/* 지도 핀 (테마 색을 따름) */
.pin{font:13px var(--body);white-space:nowrap;cursor:pointer;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin.near{border-style:dashed}
.pin.on{background:var(--chili);color:#fff;border-color:var(--chili)}
.pin:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.centerdot{width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* 필터 */
.filters{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);width:72px;flex:none}
.chip,.btn{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip:hover,.btn:hover{border-color:var(--ink)}
.chip[aria-pressed="true"],.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border-radius:6px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search],select{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:7px 12px}
.tools input[type=search]{flex:1 1 220px;min-width:0}
.check{display:flex;align-items:center;gap:6px;font-size:15px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}
details.more summary{cursor:pointer;font-size:14px;color:var(--muted);width:max-content}
details.more[open] summary{margin-bottom:10px}
details.more .inner{display:flex;flex-direction:column;gap:12px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:9px;min-width:0;scroll-margin-top:72px}
.card.on{border-color:var(--chili);box-shadow:0 0 0 1px var(--chili)}
.card.near{border-style:dashed}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:23px;line-height:1.2}
.area{font-size:14px;color:var(--muted)}
.state{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.open{font-size:13px;padding:1px 8px;border-radius:4px;font-weight:700}
.open.yes{background:var(--good-soft);color:var(--good)}
.open.brk{background:var(--mustard-soft);color:var(--ink)}
.open.no{background:var(--bg);color:var(--muted)}
.walk{font-family:var(--mono);font-size:13px;color:var(--muted)}
.main{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:8px;font-size:15px}
.main .won{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.main .won small{font-family:var(--body);font-size:12px;color:var(--muted);margin-right:4px}
.scores{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.scores span{display:inline-flex;align-items:baseline;gap:5px}
.scores i{font-style:normal;color:var(--muted);font-size:13px;box-shadow:inset 3px 0 0 var(--c);padding-left:7px}
.scores .n{--c:var(--naver)} .scores .k{--c:var(--kakao)}
.scores b{font-family:var(--mono);font-weight:500}
.quote{margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:13px;padding:2px 9px;border-radius:4px;background:var(--bg);color:var(--muted)}
.b.hot,.b.down{background:var(--chili-soft);color:var(--chili)}
.b.wait{color:var(--ink);box-shadow:inset 3px 0 0 var(--mustard)}
.b.fr,.b.stale{background:var(--mustard-soft);color:var(--ink)}
.b.visit{background:var(--good-soft);color:var(--good)}
.fails{margin:0;padding:8px 10px;border-radius:4px;background:var(--chili-soft);color:var(--chili);font-size:13px}
details.detail summary{cursor:pointer;font-size:14px;color:var(--muted)}
details.detail .body{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:8px}
details.detail .body dt{color:var(--muted)}
details.detail .body dd{margin:0;min-width:0}
details.detail .mono{font-family:var(--mono);font-size:13px}
.down{color:var(--chili)}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:auto}
.links button,.links a{font:inherit;background:none;border:0;padding:0;color:var(--chili);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 16px;border:1.5px dashed var(--line);border-radius:6px}
.empty b{color:var(--ink);font-weight:400}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:calc(100% - 32px);word-break:break-all}
@media (max-width:640px){#map{height:calc(100vh - 260px);min-height:320px}.row .lbl{width:100%}}
</style>
<script>

</div>

/* ===== 데이터 검사: 빠졌거나 잘못된 값을 화면 위에 알림 ===== */
(function validate(){
  const problems=[];
  const time=/^\d{1,2}:\d{2}[–-]\d{1,2}:\d{2}$/;
  DATA.forEach(d=>{
    const p=[];
    ["name","area","cat","menu"].forEach(k=>{ if(!d[k]) p.push(`${k} 비어 있음`); });
    if(!(d.zone in CRITERIA.reviewMin)) p.push(`zone "${d.zone}"은(는) 핵심/주거지 중 하나여야 함`);
    if(!(d.lunch>0)) p.push("lunch 가격 없음");
    if(!time.test(d.hours||"")) p.push(`hours 형식 "${d.hours}"`);
    if(d.brk!=="없음"&&!time.test(d.brk||"")) p.push(`brk 형식 "${d.brk}"`);
    if(!Array.isArray(d.off)) p.push("off(휴무 요일) 없음");
    if(typeof d.lat!=="number"||typeof d.lng!=="number") p.push("좌표 없음");
    if(isNaN(new Date(d.checked))) p.push("checked 날짜 형식");
    if(p.length) problems.push(`<b>${esc(d.name||"(이름 없음)")}</b>: ${p.map(esc).join(", ")}`);
  });
  if(problems.length){
    console.warn("데이터 확인 필요", problems);
    $("dataWarn").innerHTML=`<p class="warn">데이터에 확인이 필요한 곳이 ${problems.length}곳 있어요.<br>${problems.join("<br>")}</p>`;
    $("dataWarn").hidden=false;
  }
})();

/* ===== 기준 판정 ===== */
const reviewTotal = d=>(d.naver?.count||0)+(d.kakao?.count||0);
const reviewNeed = d=>CRITERIA.reviewMin[d.zone] ?? CRITERIA.reviewMin["핵심"];
function failures(d){
  const f=[];
  if(d.naver?.score==null) f.push("네이버 평점 없음");
  else if(d.naver.score<CRITERIA.naverMin) f.push(`네이버 ${d.naver.score.toFixed(2)} (기준 ${CRITERIA.naverMin})`);
  if(d.kakao?.score==null) f.push("카카오 평점 없음");
  else if(d.kakao.score<CRITERIA.kakaoMin) f.push(`카카오 ${d.kakao.score.toFixed(1)} (기준 ${CRITERIA.kakaoMin})`);
  if(reviewTotal(d)<reviewNeed(d)) f.push(`방문자 리뷰 ${reviewTotal(d).toLocaleString("ko-KR")}개 (${d.zone} 상권 기준 ${reviewNeed(d)}개)`);
  return f;
}
const isMatjip = d=>failures(d).length===0;
const recentDrop = d=>(d.naver?.recent!=null&&d.naver.recent<CRITERIA.naverMin)||(d.kakao?.recent!=null&&d.kakao.recent<CRITERIA.kakaoMin);
const isStale = d=>(Date.now()-new Date(d.checked))/864e5>CRITERIA.refreshDays;

/* ===== 영업 상태 ===== */
function span(str){
  const [a,b]=str.split(/[–-]/).map(t=>{const [h,m]=t.split(":").map(Number);return h*60+m;});
  return [a, b<=a?b+1440:b];
}
const inSpan = (now,[a,b])=>(now>=a&&now<b)||(now+1440>=a&&now+1440<b);
function openState(d, at=new Date()){
  const now=at.getHours()*60+at.getMinutes();
  if((d.off||[]).includes(at.getDay())) return {key:"no", label:`오늘 휴무 (${DAYS[at.getDay()]})`};
  if(!inSpan(now,span(d.hours))) return {key:"no", label:"영업 종료"};
  if(d.brk&&d.brk!=="없음"&&inSpan(now,span(d.brk))) return {key:"brk", label:`브레이크 ~${d.brk.split(/[–-]/)[1]}`};
  return {key:"yes", label:"영업 중"};
}
const walkMin = m=>Math.max(1,Math.round(m/WALK_M_PER_MIN));

/* ===== 상태 ===== */
const state = {cat:"전체", party:"전체", price:"all", q:"", sort:"auto", showFr:false, openOnly:false, radius:1000,
  center:null, centerName:"", selected:null, provider:null, view:"list"};
try{
  const p=localStorage.getItem("matjip-provider"); if(HAS_KEY[p]) state.provider=p;
  const r=+localStorage.getItem("matjip-radius"); if(RADII.includes(r)) state.radius=r;
}catch(e){}
if(!state.provider) state.provider = HAS_KEY.kakao?"kakao":HAS_KEY.naver?"naver":null;

function chips(rowId, items, key, getId, getLabel){

    b.addEventListener("click",()=>{state[key]=getId(it);render();});
    $(rowId).appendChild(b);
  });
}
chips("catRow", ["전체", ...new Set(DATA.map(d=>d.cat))], "cat", c=>c, c=>c);
chips("partyRow", PARTIES, "party", p=>p, p=>p);

RADII.forEach(r=>{
  const b=document.createElement("button"); b.type="button"; b.dataset.r=r; b.textContent=km(r);
  b.addEventListener("click",()=>{ state.radius=r; try{localStorage.setItem("matjip-radius",r);}catch(e){}
    if(state.center) map?.setCenter(state.center.lat,state.center.lng,state.radius); render(); });
  $("radiusSeg").appendChild(b);
});
$("q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});
$("showFr").addEventListener("change",e=>{state.showFr=e.target.checked;render();});

document.querySelectorAll(".viewtabs [data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
function setView(v){
  state.view=v; document.body.dataset.view=v;
  document.querySelectorAll(".viewtabs [data-view]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===v));
  if(v==="map") requestAnimationFrame(()=>map?.relayout());
}
const isPhone = ()=>matchMedia("(max-width:640px)").matches;

function baseFiltered(){
  const pt=PRICES.find(p=>p.id===state.price).test;
  const q=state.q.toLowerCase();
  return DATA.map(d=>({...d, dist: state.center?distM(state.center,d):null, open: openState(d)}))
    .filter(d=>(state.cat==="전체"||d.cat===state.cat)
      &&(state.party==="전체"||d.party.includes(state.party))
      &&pt(d.lunch)
      &&(state.showFr||!d.franchise)
      &&(!state.openOnly||d.open.key==="yes")
      &&(!state.center||d.dist<=state.radius)
      &&(!q||[d.name,d.menu,d.area,...d.tags].join(" ").toLowerCase().includes(q)));
}
function sortList(list){
  const sc=(d,pv)=>d[pv]?.score ?? -1;
  const openRank=d=>d.open.key==="yes"?0:d.open.key==="brk"?1:2;
  const s = state.sort==="auto" ? (state.center?"dist":"lunchOpen") : state.sort;
  const cmp={
    dist:(a,b)=>a.dist-b.dist,
    lunchOpen:(a,b)=>openRank(a)-openRank(b) || a.lunch-b.lunch || sc(b,"naver")-sc(a,"naver"),
    lunch:(a,b)=>a.lunch-b.lunch || sc(b,"naver")-sc(a,"naver"),
    naver:(a,b)=>sc(b,"naver")-sc(a,"naver"), kakao:(a,b)=>sc(b,"kakao")-sc(a,"kakao"),
    name:(a,b)=>a.name.localeCompare(b.name,"ko")}[s];
  return list.sort(cmp);
}
function distM(a,b){
  const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ===== 카드 ===== */
function card(d, near){
  const nUrl="https://map.naver.com/p/search/"+encodeURIComponent(d.name);
  const kUrl="https://map.kakao.com/link/search/"+encodeURIComponent(d.name);
  const score=(r,cls,label)=>`<span><i class="${cls}">${label}</i><b>${r?.score!=null?"★ "+r.score.toFixed(cls==="n"?2:1):"없음"}</b></span>`;
  const recent=(r,min,digits)=>r?.recent!=null?`<span class="${r.recent<min?"down":""}">${r.recent.toFixed(digits)}</span>`:"–";
  const badges=[
    d.visited?'<span class="b visit">직접 확인</span>':'',
    recentDrop(d)?'<span class="b down">최근 하락</span>':'',
    d.franchise?'<span class="b fr">프랜차이즈</span>':'',
    d.wait?'<span class="b wait">웨이팅 있음</span>':'',
    isStale(d)?'<span class="b stale">갱신 필요</span>':''
  ].join("");
  return `<article class="card${near?" near":""}${state.selected===d.name?" on":""}" id="${esc(slug(d))}" data-name="${esc(d.name)}">
    <div class="top"><div><h3>${esc(d.name)}</h3><div class="area">${esc(d.area)} · ${esc(d.cat)}</div></div></div>
    <div class="state"><span class="open ${d.open.key}">${esc(d.open.label)}</span>${d.dist!=null?`<span class="walk">도보 약 ${walkMin(d.dist)}분 · ${d.dist<1000?Math.round(d.dist/10)*10+"m":(d.dist/1000).toFixed(1)+"km"}</span>`:""}</div>
    ${near?`<p class="fails">기준 미달: ${failures(d).map(esc).join(" · ")}</p>`:""}
    <div class="main"><span>${esc(d.menu)}</span><span class="won"><small>점심</small>${fmt(d.lunch)}</span></div>
    <div class="scores">${score(d.naver,"n","네이버")}${score(d.kakao,"k","카카오")}</div>
    ${d.visited&&d.quote?`<p class="quote">${esc(d.quote)}</p>`:""}
    ${badges?`<div class="badges">${badges}</div>`:""}
    <details class="detail"><summary>자세히</summary>
      <dl class="body">
        <dt>최근 ${CRITERIA.recentMonths}개월</dt><dd class="mono">네이버 ${recent(d.naver,CRITERIA.naverMin,2)} · 카카오 ${recent(d.kakao,CRITERIA.kakaoMin,1)}</dd>
        <dt>방문자 리뷰</dt><dd class="mono">네이버 ${(d.naver?.count||0).toLocaleString("ko-KR")} · 카카오 ${(d.kakao?.count||0).toLocaleString("ko-KR")}</dd>
        <dt>저녁</dt><dd class="mono">${fmt(d.dinner)}</dd>
        <dt>영업</dt><dd>${esc(d.hours)} · 브레이크 ${esc(d.brk)}${d.off.length?` · ${d.off.map(i=>DAYS[i]).join("·")}요일 휴무`:""}</dd>
        <dt>인원</dt><dd>${d.party.join(" · ")}</dd>
        <dt>상권</dt><dd>${esc(d.zone)}</dd>
        ${d.tags.length?`<dt>태그</dt><dd>${d.tags.map(esc).join(" · ")}</dd>`:""}
        <dt>확인일</dt><dd class="mono">${esc(d.checked)}</dd>
      </dl>
    </details>
    <div class="links"><button type="button" data-focus="${esc(d.name)}">지도에서 보기</button><button type="button" data-share="${esc(d.name)}">링크 복사</button><a href="${nUrl}" target="_blank" rel="noopener">네이버 지도</a><a href="${kUrl}" target="_blank" rel="noopener">카카오맵</a></div>
  </article>`;
}

function render(){
  for(const [row,key] of [["catRow","cat"],["partyRow","party"],["priceRow","price"]])
    document.querySelectorAll(`#${row} .chip`).forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===state[key]));
  document.querySelectorAll("#pvSeg [data-pv]").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.pv===state.provider);
    b.disabled=!HAS_KEY[b.dataset.pv]; if(b.disabled) b.title="키가 없어 쓸 수 없어요";
  });
  document.querySelectorAll("#radiusSeg button").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.r===state.radius));

  const base=baseFiltered();
  const list=sortList(base.filter(isMatjip));
  const scope = state.center ? `반경 ${km(state.radius)} 안` : "전체";
  const openN = list.filter(d=>d.open.key==="yes").length;
  $("count").textContent = `${scope} 맛집 ${list.length}곳 · 지금 영업 중 ${openN}곳`
    + (state.center?"":" · 위치를 정하면 걸어갈 수 있는 곳부터 보여요");

  let html = list.map(d=>card(d,false)).join("");
  let shown = list;
  if(!list.length){
    const near = sortList(base.filter(d=>!isMatjip(d))).sort((a,b)=>failures(a).length-failures(b).length).slice(0,3);
    html = `<div class="empty"><b>${scope}에는 기준을 모두 넘은 곳이 없어요.</b><br>${near.length?"기준에 조금 못 미치는 근접 후보를 보여 드릴게요. 반경을 넓히거나 필터를 바꿔 볼 수도 있어요.":"반경을 넓히거나 필터를 '전체'로 바꿔 보세요."}</div>`
      + near.map(d=>card(d,true)).join("");
    shown = near;
  }
  $("grid").innerHTML = html;
  renderStatus();
  if(map) map.setPlaces(shown, state.selected, n=>focusPlace(n,true));
}
function renderStatus(){
  if(!state.provider){ $("status").innerHTML='<span class="hint">지도 키가 없어 목록만 보여 드려요. 파일 위쪽에 네이버나 카카오 키를 넣으면 지도가 켜져요.</span>'; return; }
  $("status").innerHTML = state.center
    ? `📍 <b>${esc(state.centerName||"선택한 위치")}</b> 기준 반경 ${km(state.radius)}`
    : '<span class="hint">지도를 클릭하거나 주소를 검색해 기준 위치를 정하세요.</span>';
}
$("grid").addEventListener("click",e=>{
  const f=e.target.closest("[data-focus]")?.dataset.focus;
  if(f) return focusPlace(f);
  const s=e.target.closest("[data-share]")?.dataset.share;
  if(s) share(s);
});

function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function share(name){
  const d=DATA.find(x=>x.name===name); if(!d) return;
  const url=location.href.split("#")[0]+"#"+encodeURIComponent(slug(d));
  const ok=()=>toast("링크를 복사했어요");
  try{ navigator.clipboard.writeText(url).then(ok,()=>toast(url)); }catch(e){ toast(url); }
}

$("criteria").innerHTML =
  `<span class="head">맛집 기준</span><span>네이버 ★ <b>${CRITERIA.naverMin.toFixed(1)}</b> 이상</span>`
  + `<span>카카오 ★ <b>${CRITERIA.kakaoMin.toFixed(1)}</b> 이상</span>`
  + `<span>방문자 리뷰 핵심 상권 <b>${CRITERIA.reviewMin["핵심"]}</b>개 · 주거지 <b>${CRITERIA.reviewMin["주거지"]}</b>개 이상</span>`;

/* ===== 지도 공통 ===== */
function pinEl(d, on, pv, onClick){
  const el=document.createElement("button");
  el.type="button";
  const s=d[pv]?.score;
  el.className=`pin${on?" on":""}${isMatjip(d)?"":" near"}`;
  el.textContent=`${d.name} ${s!=null?"★"+s.toFixed(1):""}`;
  el.setAttribute("aria-label",`${d.name} 카드 보기`);
  el.addEventListener("click",ev=>{ev.stopPropagation();onClick(d.name);});
  return el;
}
function centerDot(){ const el=document.createElement("div"); el.className="centerdot"; return el; }
function loadScript(src){
  return new Promise((ok,fail)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=fail;document.head.appendChild(s);});
}
const CIRCLE = "#C8281E";

/* ===== 네이버 어댑터 ===== */
const NaverMap = {
  async init(el,onClick){
    window.navermap_authFailure=()=>{el.innerHTML='<div class="mapmsg">네이버 지도 인증에 실패했어요. 콘솔에 이 페이지 주소가 Web 서비스 URL로 등록돼 있는지 확인해 주세요.</div>';};
    if(!window.naver?.maps) await loadScript(`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(NAVER_KEY_ID)}&submodules=geocoder`);
    el.innerHTML="";
    const N=naver.maps;
    this.m=new N.Map(el,{center:new N.LatLng(37.54,126.99),zoom:12,zoomControl:true,zoomControlOptions:{position:N.Position.TOP_RIGHT}});
    N.Event.addListener(this.m,"click",e=>onClick(e.coord.lat(),e.coord.lng()));
    this.pins={};
  },
  setCenter(lat,lng,radius){
    const N=naver.maps, p=new N.LatLng(lat,lng);
    if(!this.dot){
      this.dot=new N.Marker({position:p,zIndex:200,icon:{content:centerDot(),anchor:new N.Point(9,9)}});
      this.circle=new N.Circle({center:p,radius,strokeColor:CIRCLE,strokeWeight:2,strokeOpacity:.8,fillColor:CIRCLE,fillOpacity:.08,clickable:false});
    }
    this.dot.setPosition(p); this.circle.setCenter(p); this.circle.setRadius(radius);
    this.dot.setMap(this.m); this.circle.setMap(this.m);
    this.m.fitBounds(this.circle.getBounds());
  },
  clearCenter(){ this.dot?.setMap(null); this.circle?.setMap(null); },
  setPlaces(list,selected,onPick){
    const N=naver.maps;
    Object.values(this.pins).forEach(m=>m.setMap(null)); this.pins={};
    list.forEach(d=>{
      const on=selected===d.name;
      this.pins[d.name]=new N.Marker({map:this.m,position:new N.LatLng(d.lat,d.lng),zIndex:on?150:100,
        icon:{content:pinEl(d,on,"naver",onPick),anchor:new N.Point(0,30)}});
    });
  },
  panTo(lat,lng){ this.m.panTo(new naver.maps.LatLng(lat,lng)); },
  relayout(){ try{ this.m?.autoResize(); }catch(e){} },
  search(q,cb){
    if(!naver.maps.Service) return cb(null);
    naver.maps.Service.geocode({query:q},(st,res)=>{
      const a=res?.v2?.addresses?.[0];
      cb(st===naver.maps.Service.Status.OK&&a?{lat:+a.y,lng:+a.x,name:a.roadAddress||a.jibunAddress||q}:null);
    });
  },
  reverse(lat,lng,cb){
    if(!naver.maps.Service) return;
    naver.maps.Service.reverseGeocode({coords:new naver.maps.LatLng(lat,lng),orders:"roadaddr,addr"},(st,res)=>{
      const a=res?.v2?.address; if(st===naver.maps.Service.Status.OK) cb(a?.roadAddress||a?.jibunAddress);
    });
  },
  destroy(){ this.m?.destroy(); this.dot=this.circle=null; }
};

/* ===== 카카오 어댑터 ===== */
const KakaoMap = {
  async init(el,onClick){
    if(!window.kakao?.maps){
      await loadScript(`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_JS_KEY)}&libraries=services&autoload=false`);
      await new Promise(r=>kakao.maps.load(r));
    }
    el.innerHTML="";
    const K=kakao.maps;
    this.m=new K.Map(el,{center:new K.LatLng(37.54,126.99),level:8});
    this.m.addControl(new K.ZoomControl(),K.ControlPosition.TOPRIGHT);
    K.event.addListener(this.m,"click",e=>onClick(e.latLng.getLat(),e.latLng.getLng()));
    this.geo=new K.services.Geocoder(); this.places=new K.services.Places();
    this.pins=[];
  },
  setCenter(lat,lng,radius){
    const K=kakao.maps, p=new K.LatLng(lat,lng);
    if(!this.dot){
      this.dot=new K.CustomOverlay({content:centerDot(),zIndex:200});
      this.circle=new K.Circle({radius,strokeWeight:2,strokeColor:CIRCLE,strokeOpacity:.8,fillColor:CIRCLE,fillOpacity:.08});
    }
    this.dot.setPosition(p); this.circle.setPosition(p); this.circle.setRadius(radius);
    this.dot.setMap(this.m); this.circle.setMap(this.m);
    this.m.setBounds(this.circle.getBounds());
  },
  clearCenter(){ this.dot?.setMap(null); this.circle?.setMap(null); },
  setPlaces(list,selected,onPick){
    const K=kakao.maps;
    this.pins.forEach(o=>o.setMap(null));
    this.pins=list.map(d=>{
      const on=selected===d.name;
      return new K.CustomOverlay({map:this.m,position:new K.LatLng(d.lat,d.lng),yAnchor:1.3,zIndex:on?150:100,
        content:pinEl(d,on,"kakao",onPick)});
    });
  },
  panTo(lat,lng){ this.m.panTo(new kakao.maps.LatLng(lat,lng)); },
  relayout(){ try{ this.m?.relayout(); }catch(e){} },
  search(q,cb){
    const S=kakao.maps.services.Status;
    this.places.keywordSearch(q,(res,st)=>{
      if(st===S.OK&&res[0]) return cb({lat:+res[0].y,lng:+res[0].x,name:res[0].place_name});
      this.geo.addressSearch(q,(r2,st2)=>{
        cb(st2===S.OK&&r2[0]?{lat:+r2[0].y,lng:+r2[0].x,name:r2[0].address_name}:null);
      });
    });
  },
  reverse(lat,lng,cb){
    this.geo.coord2Address(lng,lat,(res,st)=>{
      if(st===kakao.maps.services.Status.OK&&res[0]) cb(res[0].road_address?.address_name||res[0].address?.address_name);
    });
  },
  destroy(){ this.pins?.forEach(o=>o.setMap(null)); this.dot?.setMap(null); this.circle?.setMap(null); this.dot=this.circle=null; this.m=null; }
};

/* ===== 지도 전환 ===== */
let map=null;
async function useProvider(pv){
  if(map){ map.destroy(); map=null; }
  state.provider=pv;
  const box=$("mapbox"), el=$("map");
  if(!pv){ box.classList.add("nomap"); render(); return; }
  box.classList.remove("nomap");
  try{ localStorage.setItem("matjip-provider",pv); }catch(e){}
  el.innerHTML=`<div class="mapmsg">${PV_NAME[pv]}를 불러오는 중…</div>`;
  render();
  const adapter = pv==="naver"?NaverMap:KakaoMap;
  try{
    await adapter.init(el,(lat,lng)=>{
      setCenter(lat,lng,"지도에서 고른 위치");
      map?.reverse(lat,lng,n=>{ if(n&&state.center){ state.centerName=n; renderStatus(); }});
    });
    if(state.provider!==pv) return;
    map=adapter;
    if(state.center) map.setCenter(state.center.lat,state.center.lng,state.radius);
    render();
  }catch(err){
    el.innerHTML=`<div class="mapmsg"><div>${PV_NAME[pv]}를 불러오지 못했어요. 키와 등록한 도메인을 확인해 주세요.<br><span class="hint">지도 없이도 목록과 필터는 그대로 쓸 수 있어요.</span></div></div>`;
  }
}
document.querySelectorAll("#pvSeg [data-pv]").forEach(b=>b.addEventListener("click",()=>{
  if(b.dataset.pv!==state.provider&&HAS_KEY[b.dataset.pv]) useProvider(b.dataset.pv);
}));

function setCenter(lat,lng,name){
  state.center={lat,lng}; state.centerName=name; state.selected=null;
  map?.setCenter(lat,lng,state.radius);
  render();
}
function clearCenter(){
  state.center=null; state.centerName=""; state.selected=null;
  map?.clearCenter(); render();
}
function focusPlace(name,fromMap){
  state.selected=name;
  const d=DATA.find(x=>x.name===name);
  if(!fromMap&&isPhone()&&map) setView("map");
  if(map&&d&&!fromMap) map.panTo(d.lat,d.lng);
  if(fromMap&&isPhone()) setView("list");
  render();
  const el=document.getElementById(slug(d));
  if(fromMap&&el) el.scrollIntoView({behavior:"smooth",block:"center"});
  else if(map) $("map").scrollIntoView({behavior:"smooth",block:"center"});
}

$("locForm").addEventListener("submit",e=>{
  e.preventDefault();
  const q=$("addr").value.trim(); if(!q) return;
  const m=q.match(/^\s*(3[3-9]\.\d+)\s*,\s*(12[4-9]\.\d+|13[0-2]\.\d+)\s*$/);
  if(m){ setCenter(+m[1],+m[2],"입력한 좌표"); return; }
  if(!map){ $("status").innerHTML='<span class="hint">지도가 연결돼야 주소 검색을 할 수 있어요.</span>'; return; }
  map.search(q,r=>{
    if(r) setCenter(r.lat,r.lng,r.name);
    else $("status").innerHTML=`<span class="hint">'${esc(q)}' 위치를 찾지 못했어요. ${state.provider==="naver"?"네이버 지도는 주소로만 검색돼요. 도로명·지번 주소로 다시 검색하거나 ":""}지도를 직접 클릭해 주세요.</span>`;
  });
});
$("myLoc").addEventListener("click",()=>{
  if(!navigator.geolocation){ $("status").innerHTML='<span class="hint">이 브라우저에서는 내 위치를 쓸 수 없어요.</span>'; return; }
  navigator.geolocation.getCurrentPosition(
    p=>setCenter(p.coords.latitude,p.coords.longitude,"내 위치"),
    ()=>{$("status").innerHTML='<span class="hint">위치 권한이 없어 내 위치를 가져오지 못했어요. 지도를 클릭해 주세요.</span>';},
    {enableHighAccuracy:true,timeout:8000});
});
$("clearLoc").addEventListener("click",clearCenter);

/* 공유 링크(#p-가게이름)로 들어오면 그 가게를 펼쳐서 보여 줌 */
function openFromHash(){
  const id=decodeURIComponent(location.hash.slice(1)); if(!id) return;
  const d=DATA.find(x=>slug(x)===id); if(!d) return;
  if(d.franchise) state.showFr=true, $("showFr").checked=true;
  state.selected=d.name; render();
  const el=document.getElementById(id);
  if(el){ el.querySelector("details")?.setAttribute("open",""); el.scrollIntoView({block:"center"}); }
}
window.addEventListener("hashchange",openFromHash);

setView("list");
render();
openFromHash();
useProvider(state.provider);
// 영업 상태를 1분마다 갱신 (펼쳐 둔 카드가 있으면 접히지 않게 건너뜀)
setInterval(()=>{ if(!document.querySelector("#grid details[open]")) render(); }, 60000);
</script>
