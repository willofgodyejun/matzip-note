<title>골목 맛집 수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 간판 같은 헤더 → 필터 바(가게 메뉴판 탭) → 카드 그리드, 카드 상단에 '오늘의 추천' 한 곳을 크게 */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1C2320; --muted:#5E6A64; --line:#D9E0DB;
  --chili:#C8281E; --chili-soft:#FBE3E0; --mustard:#E0A526;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1D2421; --ink:#ECF1EE; --muted:#9AA8A1; --line:#2F3934;
  --chili:#F0564A; --chili-soft:#3A1F1C; --mustard:#E8B649; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1D2421; --ink:#ECF1EE; --muted:#9AA8A1; --line:#2F3934;
  --chili:#F0564A; --chili-soft:#3A1F1C; --mustard:#E8B649; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:32px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:20px}
.sign{font-family:var(--display);font-size:clamp(40px,8vw,72px);line-height:1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sign em{font-style:normal;color:var(--chili)}
.tag{margin:8px 0 0;color:var(--muted);max-width:42ch}
.note{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);border:1px dashed var(--line);padding:6px 10px;border-radius:4px}

/* 오늘의 추천 */
.pick{display:grid;grid-template-columns:1.1fr 1fr;gap:0;background:var(--ink);color:var(--bg);border-radius:6px;overflow:hidden}
.pick .art{background:var(--chili);min-height:220px;position:relative;display:grid;place-items:center}
.pick .art span{font-family:var(--display);font-size:clamp(64px,12vw,120px);color:#fff;opacity:.95;line-height:1}
.pick .art small{position:absolute;left:16px;top:14px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:#fff}
.pick .info{padding:28px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pick h2{font-family:var(--display);font-size:32px;margin:0;line-height:1.15;font-weight:400}
.pick p{margin:0;opacity:.85}
.pick .meta{font-family:var(--mono);font-size:13px;opacity:.75}

/* 필터 */
.filters{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);width:64px;flex:none}
.chip{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--chili);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
input[type=search],select{font:inherit;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:7px 12px}
input[type=search]{flex:1 1 220px;min-width:0}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2}
.area{font-size:14px;color:var(--muted)}
.score{font-family:var(--mono);font-size:15px;color:var(--chili);white-space:nowrap}
.menu{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:8px;font-size:15px}
.menu b{font-weight:400}
.menu .won{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.quote{margin:0;color:var(--ink)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.b{font-size:13px;padding:2px 9px;border-radius:4px;background:var(--bg);color:var(--muted)}
.b.hot{background:var(--chili-soft);color:var(--chili)}
.b.wait{color:var(--ink);box-shadow:inset 3px 0 0 var(--mustard)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;border:1.5px dashed var(--line);border-radius:6px}

@media (max-width:640px){.pick{grid-template-columns:1fr}.pick .art{min-height:140px}.row .lbl{width:100%}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 class="sign">골목 <em>맛집</em> 수첩</h1>
      <p class="tag">직접 가 보고 다시 갈 곳만 적어 둔 맛집 목록. 종류와 가격대로 골라 보세요.</p>
    </div>
    <span class="note">초안 · 가게 정보는 예시 데이터</span>
  </header>

  <section class="pick" aria-label="오늘의 추천">
    <div class="art"><small>TODAY'S PICK</small><span id="pickGlyph">국</span></div>
    <div class="info">
      <h2 id="pickName"></h2>
      <p id="pickWhy"></p>
      <div class="meta" id="pickMeta"></div>
    </div>
  </section>

  <section class="filters" aria-label="필터">
    <div class="row" id="catRow"><span class="lbl">종류</span></div>
    <div class="row" id="partyRow"><span class="lbl">인원수</span></div>
    <div class="row" id="priceRow"><span class="lbl">1인 가격</span></div>
    <div class="tools">
      <input type="search" id="q" placeholder="가게 이름, 메뉴, 동네로 찾기" aria-label="검색">
      <select id="sort" aria-label="정렬">
        <option value="score">평점 높은 순</option>
        <option value="price">가격 낮은 순</option>
        <option value="name">이름순</option>
      </select>
    </div>
    <div class="count" id="count"></div>
  </section>

  <section class="grid" id="grid" aria-live="polite"></section>
</div>

<script>
const DATA = [
  {name:"할매 순대국", area:"시장 골목", cat:"한식", menu:"순대국 특", won:10000, score:4.6, quote:"국물이 맑고 진해요. 깍두기 리필 필수.", tags:["혼밥","아침 영업"], wait:false, glyph:"국", party:["1인","2인","3~4인"]},
  {name:"소금 우동집", area:"역 앞 2번 출구", cat:"일식", menu:"붓카케 우동", won:9500, score:4.4, quote:"면발 탄력이 확실히 달라요. 튀김 추가 추천.", tags:["혼밥"], wait:true, glyph:"麺", party:["1인","2인"]},
  {name:"홍원 반점", area:"구청 뒤편", cat:"중식", menu:"고추 짬뽕", won:11000, score:4.5, quote:"불맛 제대로. 탕수육은 부먹으로 나와요.", tags:["단체석","매운맛"], wait:true, glyph:"中", party:["2인","3~4인","5인 이상"]},
  {name:"오븐 앤 바질", area:"공원 길", cat:"양식", menu:"마르게리타 피자", won:19000, score:4.2, quote:"도우가 쫄깃하고 토마토소스가 상큼해요.", tags:["데이트"], wait:false, glyph:"P", party:["2인","3~4인"]},
  {name:"솥밥 한 끼", area:"주택가 안쪽", cat:"한식", menu:"전복 솥밥", won:16000, score:4.7, quote:"누룽지까지 한 그릇. 반찬이 정갈해요.", tags:["부모님과","예약 가능"], wait:true, glyph:"밥", party:["2인","3~4인"]},
  {name:"동네 돈카츠", area:"학교 앞", cat:"일식", menu:"로스카츠 정식", won:13000, score:4.3, quote:"두툼한데 촉촉해요. 소금 찍어 먹기 좋아요.", tags:["혼밥"], wait:false, glyph:"カ", party:["1인","2인"]},
  {name:"마포 숯불갈비", area:"먹자골목", cat:"한식", menu:"돼지 양념갈비 1인", won:17000, score:4.4, quote:"직원분이 구워 줘요. 냉면 마무리 추천.", tags:["회식","단체석"], wait:true, glyph:"肉", party:["2인","3~4인","5인 이상"]},
  {name:"느린 커피", area:"강변 산책로", cat:"카페", menu:"핸드드립 + 휘낭시에", won:8500, score:4.5, quote:"창가 자리에서 강이 보여요. 노트북 OK.", tags:["작업하기"], wait:false, glyph:"珈", party:["1인","2인"]},
  {name:"쌀국수 사이공", area:"역 앞 상가 2층", cat:"아시안", menu:"양지 쌀국수", won:10500, score:4.1, quote:"고수 듬뿍 요청 가능. 국물이 깔끔해요.", tags:["혼밥","해장"], wait:false, glyph:"粉", party:["1인","2인","3~4인"]},
  {name:"파스타 바 루체", area:"공원 길", cat:"양식", menu:"명란 크림 파스타", won:17500, score:4.0, quote:"양이 넉넉하고 와인 한 잔 하기 좋아요.", tags:["데이트","예약 가능"], wait:false, glyph:"F", party:["2인","3~4인"]},
  {name:"양꼬치 초원", area:"먹자골목", cat:"아시안", menu:"양갈비 + 꿔바로우", won:28000, score:4.3, quote:"양갈비 잡내 없이 부드러워요. 넓은 테이블.", tags:["회식","단체석"], wait:true, glyph:"羊", party:["2인","3~4인","5인 이상"]},
  {name:"스시 하루", area:"구청 뒤편", cat:"일식", menu:"런치 오마카세", won:35000, score:4.8, quote:"바 자리 8석뿐. 셰프 설명 들으며 먹는 재미.", tags:["기념일","예약 필수"], wait:false, glyph:"鮨", party:["1인","2인"]},
  {name:"한우 다이닝 소반", area:"강변 산책로", cat:"한식", menu:"한우 코스 (점심)", won:48000, score:4.6, quote:"부모님 생신 때 갔는데 룸이 조용해서 좋았어요.", tags:["부모님과","룸 있음","예약 필수"], wait:false, glyph:"牛", party:["2인","3~4인"]}
];
const PARTIES = ["전체","1인","2인","3~4인","5인 이상"];
const PRICES = [
  {id:"all", label:"전체", test:()=>true},
  {id:"p1", label:"1만원 이하", test:w=>w<=10000},
  {id:"p2", label:"1~2만원", test:w=>w>10000&&w<=20000},
  {id:"p3", label:"2~3만원", test:w=>w>20000&&w<=30000},
  {id:"p4", label:"3~4만원", test:w=>w>30000&&w<=40000},
  {id:"p5", label:"4~5만원", test:w=>w>40000&&w<=50000}
];
const CATS = ["전체", ...new Set(DATA.map(d=>d.cat))];
let state = {cat:"전체", party:"전체", price:"all", q:"", sort:"score"};
try{ const s=JSON.parse(localStorage.getItem("matjip-filter")||"null"); if(s) state={...state,...s,q:""}; }catch(e){}
if(!PRICES.some(p=>p.id===state.price)) state.price="all";
if(!PARTIES.includes(state.party)) state.party="전체";
if(!CATS.includes(state.cat)) state.cat="전체";

const $ = id=>document.getElementById(id);
const fmt = n=>n.toLocaleString("ko-KR")+"원";

function chips(rowId, items, key, getId, getLabel){
  const row=$(rowId);
  items.forEach(it=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.id=`${key}-${getId(it)}`;
    b.textContent=getLabel(it);
    b.addEventListener("click",()=>{state[key]=getId(it);render();});
    row.appendChild(b);
  });
}
chips("catRow", CATS, "cat", c=>c, c=>c);
chips("partyRow", PARTIES, "party", p=>p, p=>p);
chips("priceRow", PRICES, "price", p=>p.id, p=>p.label);
$("sort").value=state.sort;
$("q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;render();});

function card(d){
  return `<article class="card">
    <div class="top"><div><h3>${d.name}</h3><div class="area">${d.area} · ${d.cat}</div><div class="area">${d.party.join(" · ")} 추천</div></div>
    <div class="score" aria-label="평점 ${d.score}점">★ ${d.score.toFixed(1)}</div></div>
    <div class="menu"><b>${d.menu}</b><span class="won">${fmt(d.won)}</span></div>
    <p class="quote">${d.quote}</p>
    <div class="badges">${d.wait?'<span class="b wait">웨이팅 있음</span>':''}${d.tags.map(t=>`<span class="b${t==='매운맛'?' hot':''}">${t}</span>`).join("")}</div>
  </article>`;
}

function render(){
  document.querySelectorAll("#catRow .chip").forEach(b=>b.setAttribute("aria-pressed", b.id==="cat-"+state.cat));
  document.querySelectorAll("#partyRow .chip").forEach(b=>b.setAttribute("aria-pressed", b.id==="party-"+state.party));
  document.querySelectorAll("#priceRow .chip").forEach(b=>b.setAttribute("aria-pressed", b.id==="price-"+state.price));
  const pt=PRICES.find(p=>p.id===state.price).test;
  const q=state.q.toLowerCase();
  let list=DATA.filter(d=>(state.cat==="전체"||d.cat===state.cat)&&(state.party==="전체"||d.party.includes(state.party))&&pt(d.won)&&
    (!q||[d.name,d.menu,d.area,...d.tags].join(" ").toLowerCase().includes(q)));
  list.sort(state.sort==="score"?(a,b)=>b.score-a.score:state.sort==="price"?(a,b)=>a.won-b.won:(a,b)=>a.name.localeCompare(b.name,"ko"));
  $("count").textContent=`${list.length}곳`;
  $("grid").innerHTML=list.length?list.map(card).join(""):
    `<div class="empty">조건에 맞는 가게가 없어요. 가격대나 종류를 '전체'로 바꿔 보세요.</div>`;
  try{localStorage.setItem("matjip-filter",JSON.stringify({cat:state.cat,party:state.party,price:state.price,sort:state.sort}));}catch(e){}
}

// 오늘의 추천: 날짜마다 한 곳씩 돌아가며
(function(){
  const d=new Date(); const i=(d.getFullYear()*372+d.getMonth()*31+d.getDate())%DATA.length;
  const p=DATA[i];
  $("pickGlyph").textContent=p.glyph;
  $("pickName").textContent=p.name;
  $("pickWhy").textContent=p.quote;
  $("pickMeta").textContent=`${p.area} · ${p.menu} ${fmt(p.won)} · ★ ${p.score.toFixed(1)}`;
})();
render();
</script>
