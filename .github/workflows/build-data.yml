name: 공공데이터 변환

# data/raw 에 CSV 를 올리거나 바꾸면 data/public 을 다시 만들어 커밋합니다.
on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "scripts/build-public-data.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: CSV → JSON 변환
        run: node scripts/build-public-data.mjs
      - name: 바뀐 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "공공데이터 갱신 ($(date +%Y-%m-%d))"
            git push
          fi
